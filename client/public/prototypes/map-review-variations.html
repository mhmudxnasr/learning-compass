<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Learning Compass - Review desk directions</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23244f3b'/%3E%3Cpath d='M9 22c7 0 12-5 14-13-8 2-13 7-14 13Zm0 0c2-4 5-7 10-9' fill='none' stroke='%23fffdf8' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --rail:#16281f; --ink:#1c211d; --secondary:#525b54; --muted:#707a72;
      --canvas:#fffdf8; --shell:#f4f1eb; --ledger:#faf8f3; --seam:#d8d2c6;
      --green:#244f3b; --focus:#2f634b; --lichen:#e8f0ea; --blue:#315f7b;
      --ochre:#9a5818; --danger:#a8382b; --faith:#725c2e;
      --radius:8px; --shadow:0 14px 38px rgba(22,40,31,.11); --text-body:14px; --text-metric:18px;
    }
    * { box-sizing:border-box; }
    html { color:var(--ink); background:var(--shell); font-family:"IBM Plex Sans",system-ui,sans-serif; }
    body { margin:0; }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
    ::selection { color:var(--canvas); background:var(--green); }
    .lab { min-height:100vh; }
    .lab-head { position:sticky; z-index:20; top:0; padding:17px clamp(16px,3.5vw,52px); border-bottom:1px solid var(--seam); background:rgba(255,253,248,.96); }
    .lab-intro { display:flex; align-items:end; justify-content:space-between; gap:28px; margin-bottom:13px; }
    .lab-intro h1 { margin:0; font:650 clamp(24px,3vw,38px)/1.05 Georgia,serif; letter-spacing:-.025em; }
    .lab-intro p { max-width:68ch; margin:0; color:var(--secondary); font-size:var(--text-body); line-height:1.5; }
    .switcher { display:flex; gap:6px; overflow-x:auto; padding:2px; scrollbar-width:thin; }
    .switcher button { min-width:44px; min-height:44px; padding:7px 13px; white-space:nowrap; border:1px solid var(--seam); border-radius:6px; color:var(--secondary); background:var(--canvas); }
    .switcher button[aria-selected="true"] { color:var(--canvas); border-color:var(--green); background:var(--green); }
    main { width:min(1500px,100%); margin:auto; padding:clamp(22px,3.5vw,52px); }
    .variant { display:none; }
    .variant.active { display:block; }
    .variant-head { display:flex; align-items:end; justify-content:space-between; gap:24px; margin-bottom:20px; padding-bottom:14px; border-bottom:1px solid var(--seam); }
    .variant-head h2 { margin:0 0 5px; font:650 clamp(25px,3vw,38px)/1.08 Georgia,serif; letter-spacing:-.02em; }
    .variant-head p { max-width:72ch; margin:0; color:var(--secondary); line-height:1.55; }
    .variant-actions { display:flex; align-items:center; gap:10px; flex-shrink:0; }
    .choice { min-height:44px; padding:0 15px; border:1px solid var(--green); border-radius:6px; color:var(--canvas); background:var(--green); font-weight:700; }
    .choice.selected { color:var(--green); background:var(--lichen); }
    .tag,.pill,.state { display:inline-flex; align-items:center; justify-content:center; min-height:26px; padding:3px 9px; border:1px solid var(--seam); border-radius:999px; color:var(--secondary); background:var(--canvas); font-size:12px; white-space:nowrap; }
    .tag { color:var(--green); border-color:color-mix(in srgb,var(--green) 28%,var(--seam)); }
    .state.priority { color:var(--blue); border-color:color-mix(in srgb,var(--blue) 35%,var(--seam)); background:color-mix(in srgb,var(--blue) 8%,var(--canvas)); }
    .state.uncovered { color:var(--ochre); border-color:color-mix(in srgb,var(--ochre) 35%,var(--seam)); background:color-mix(in srgb,var(--ochre) 7%,var(--canvas)); }
    .state.stable { color:var(--green); background:var(--lichen); }
    .state.archived { color:var(--danger); }
    .surface { min-height:620px; overflow:hidden; border:1px solid var(--seam); border-radius:10px; background:var(--canvas); box-shadow:0 1px 3px rgba(22,40,31,.04); }
    .surface-bar { display:flex; align-items:center; justify-content:space-between; gap:14px; min-height:56px; padding:9px 16px; border-bottom:1px solid var(--seam); background:var(--ledger); }
    .surface-title { font:650 17px Georgia,serif; }
    .tools { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
    .tool,.inline-action { min-height:38px; padding:0 11px; border:1px solid var(--seam); border-radius:6px; color:var(--secondary); background:var(--canvas); }
    .tool.active { color:var(--green); border-color:var(--green); background:var(--lichen); }
    .search { width:min(300px,38vw); min-height:40px; padding:0 12px; border:1px solid var(--seam); border-radius:6px; color:var(--ink); background:var(--canvas); }
    .muted { color:var(--muted); }
    .meta { color:var(--muted); font-size:12px; }
    .mono { font-variant-numeric:tabular-nums; }
    .branch-title { margin:0; font:650 18px/1.25 Georgia,serif; }
    .meter { height:5px; overflow:hidden; border-radius:99px; background:var(--seam); }
    .meter i { display:block; height:100%; background:var(--green); }
    .plain-list { margin:0; padding:0; list-style:none; }
    .edit-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .field { display:grid; gap:5px; color:var(--secondary); font-size:12px; font-weight:650; }
    .field.wide { grid-column:1/-1; }
    .field input,.field select,.field textarea { width:100%; min-height:42px; padding:9px 11px; border:1px solid var(--seam); border-radius:6px; color:var(--ink); background:var(--canvas); }
    .field textarea { min-height:84px; resize:vertical; line-height:1.45; }
    .status-row { display:flex; gap:6px; flex-wrap:wrap; }
    .branch-decision { margin-top:18px; padding:16px; border:1px solid var(--seam); border-radius:var(--radius); background:var(--canvas); }
    .branch-decision-head { display:flex; align-items:start; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .branch-decision-head strong { display:block; margin-bottom:3px; font-family:Georgia,serif; }
    .branch-decision-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
    .branch-decision-actions button { min-height:44px; padding:8px 10px; border:1px solid var(--seam); border-radius:6px; color:var(--secondary); background:var(--canvas); font-weight:700; }
    .branch-decision-actions button:hover { color:var(--ink); border-color:var(--focus); }
    .branch-decision-actions button.is-keep.is-selected { color:var(--canvas); border-color:var(--green); background:var(--green); }
    .branch-decision-actions button.is-priority.is-selected { color:var(--canvas); border-color:var(--blue); background:var(--blue); }
    .branch-decision-actions button.is-pause.is-selected { color:var(--ink); border-color:var(--muted); background:var(--shell); }
    .branch-decision-actions button.is-archive { color:var(--danger); border-color:color-mix(in srgb,var(--danger) 38%,var(--seam)); }
    .branch-decision-actions button.is-archive.is-selected { color:var(--canvas); border-color:var(--danger); background:var(--danger); }
    .branch-decision.is-compact { margin:0; padding:16px; border:0; border-radius:0; border-bottom:1px solid var(--seam); background:transparent; }
    .branch-decision.is-compact .branch-decision-actions { grid-template-columns:1fr; }

    /* 1: Decision ledger */
    .decision-layout { display:grid; grid-template-columns:minmax(360px,.92fr) minmax(440px,1.08fr); min-height:620px; }
    .decision-list { border-right:1px solid var(--seam); background:var(--ledger); }
    .decision-summary { display:grid; grid-template-columns:repeat(3,1fr); border-bottom:1px solid var(--seam); }
    .decision-summary div { padding:15px; border-right:1px solid var(--seam); }
    .decision-summary div:last-child { border:0; }
    .decision-summary strong { display:block; font:650 23px Georgia,serif; }
    .decision-row { display:grid; grid-template-columns:32px minmax(0,1fr) auto; gap:12px; align-items:center; width:100%; padding:15px 16px; border:0; border-bottom:1px solid var(--seam); text-align:left; color:var(--ink); background:transparent; }
    .decision-row.active { background:var(--canvas); }
    .decision-rank { display:grid; place-items:center; width:28px; height:28px; border-radius:50%; color:var(--canvas); background:var(--ochre); font-weight:750; }
    .decision-copy { display:grid; gap:4px; }
    .decision-detail { padding:24px; }
    .detail-lead { padding-bottom:19px; border-bottom:1px solid var(--seam); }
    .detail-lead h3 { margin:7px 0; font:650 29px/1.12 Georgia,serif; }
    .detail-lead p { margin:0; max-width:62ch; color:var(--secondary); line-height:1.55; }
    .signal-strip { display:grid; grid-template-columns:repeat(4,1fr); margin:20px 0; border-block:1px solid var(--seam); }
    .signal-strip div { padding:13px 8px; border-right:1px solid var(--seam); }
    .signal-strip div:last-child { border:0; }
    .signal-strip strong { display:block; font-size:var(--text-metric); }

    /* 2: Domain matrix */
    .matrix { display:grid; grid-template-columns:repeat(3,1fr); background:var(--seam); gap:1px; }
    .domain { min-height:250px; padding:19px; background:var(--canvas); }
    .domain-head { display:flex; justify-content:space-between; gap:10px; margin-bottom:15px; }
    .domain-head h3 { margin:0; font:650 19px Georgia,serif; }
    .domain-row { display:grid; grid-template-columns:minmax(0,1fr) 52px; gap:10px; padding:11px 0; border-top:1px solid var(--seam); }
    .domain-row button { padding:0; border:0; text-align:left; color:var(--ink); background:transparent; }
    .domain-row strong { display:block; }
    .matrix-action-strip { display:grid; grid-template-columns:minmax(240px,.8fr) minmax(460px,1.2fr); gap:24px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--seam); background:var(--ledger); }
    .matrix-action-strip .branch-decision { margin:0; padding:0; border:0; background:transparent; }
    .matrix-action-strip .branch-decision-head { margin-bottom:8px; }
    .matrix-action-strip .branch-decision-actions { grid-template-columns:repeat(4,minmax(0,1fr)); }
    .matrix-drawer { display:grid; grid-template-columns:1fr 1fr; gap:24px; padding:22px; border-top:1px solid var(--seam); background:var(--ledger); }

    /* 3: One-at-a-time review */
    .review-focus { display:grid; grid-template-columns:180px minmax(0,1fr) 300px; min-height:620px; }
    .review-steps { padding:18px; color:var(--canvas); background:var(--rail); }
    .review-steps h3 { margin:0 0 18px; font:650 20px Georgia,serif; }
    .review-step { display:grid; grid-template-columns:24px 1fr; gap:8px; padding:12px 0; border-top:1px solid color-mix(in srgb,var(--canvas) 18%,transparent); color:var(--lichen); font-size:12px; }
    .review-step.current { color:var(--canvas); font-weight:700; }
    .review-main { display:grid; align-content:start; gap:24px; padding:36px; }
    .review-main h3 { margin:0; max-width:18ch; font:650 clamp(32px,4vw,56px)/1.02 Georgia,serif; letter-spacing:-.03em; }
    .review-main p { max-width:64ch; margin:0; color:var(--secondary); line-height:1.65; }
    .comparison { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; padding:18px 0; border-block:1px solid var(--seam); }
    .comparison strong { display:block; font:650 27px Georgia,serif; }
    .review-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .review-actions button { min-height:44px; padding:0 15px; border:1px solid var(--seam); border-radius:6px; color:var(--ink); background:var(--canvas); }
    .review-actions .primary { color:var(--canvas); border-color:var(--green); background:var(--green); }
    .review-context { padding:24px 18px; border-left:1px solid var(--seam); background:var(--ledger); }
    .review-context h4 { margin:0 0 12px; }
    .context-item { padding:12px 0; border-top:1px solid var(--seam); }

    /* 4: Triple pane */
    .triple { display:grid; grid-template-columns:280px minmax(420px,1fr) 280px; min-height:620px; }
    .triple-index,.triple-signals { background:var(--ledger); }
    .triple-index { border-right:1px solid var(--seam); }
    .triple-signals { border-left:1px solid var(--seam); }
    .pane-head { padding:15px; border-bottom:1px solid var(--seam); font-weight:700; }
    .index-item { width:100%; padding:13px 15px; border:0; border-bottom:1px solid var(--seam); text-align:left; color:var(--ink); background:transparent; }
    .index-item.active { background:var(--canvas); }
    .index-item span { display:block; margin-top:4px; color:var(--muted); font-size:12px; }
    .triple-dossier { padding:25px; }
    .triple-dossier h3 { margin:0 0 8px; font:650 31px Georgia,serif; }
    .topic-list { display:flex; gap:6px; flex-wrap:wrap; margin:17px 0 24px; }
    .signal-block { padding:16px; border-bottom:1px solid var(--seam); }
    .signal-block strong { display:block; margin:4px 0; font-size:var(--text-metric); }

    /* 5: Review bands */
    .bands { background:var(--ledger); }
    .band { display:grid; grid-template-columns:220px minmax(0,1fr); border-bottom:1px solid var(--seam); }
    .band-label { padding:20px; background:var(--canvas); }
    .band-label h3 { margin:0 0 5px; font:650 20px Georgia,serif; }
    .band-label p { margin:0; color:var(--muted); font-size:12px; line-height:1.45; }
    .band-items { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); }
    .band-item { min-height:145px; padding:17px; border-left:1px solid var(--seam); background:var(--ledger); }
    .band-item h4 { margin:8px 0; font:650 17px/1.25 Georgia,serif; }
    .band-item button { min-height:36px; padding:0; border:0; color:var(--green); background:transparent; font-weight:700; }

    /* 6: Attention field */
    .attention-field { padding:24px; }
    .attention-row { display:grid; grid-template-columns:220px minmax(180px,1fr) 90px 130px; gap:18px; align-items:center; min-height:72px; border-bottom:1px solid var(--seam); }
    .attention-name strong { display:block; font-family:Georgia,serif; }
    .attention-track { position:relative; height:18px; background:var(--ledger); }
    .attention-track i { position:absolute; inset:0 auto 0 0; background:var(--green); }
    .attention-target { position:absolute; top:-4px; bottom:-4px; width:1px; background:var(--danger); }
    .attention-value { font-size:12px; text-align:right; }

    /* 7: Dense register */
    .register-wrap { overflow:auto; }
    .register { width:100%; min-width:1040px; border-collapse:collapse; }
    .register th { padding:11px 13px; border-bottom:1px solid var(--seam); color:var(--muted); background:var(--ledger); font-size:12px; text-align:left; text-transform:uppercase; letter-spacing:.04em; }
    .register td { padding:13px; border-bottom:1px solid var(--seam); vertical-align:middle; }
    .register tr.selected td { background:var(--lichen); }
    .register button { padding:0; border:0; color:var(--green); background:transparent; font-weight:700; }
    .register-editor { display:grid; grid-template-columns:1fr auto; gap:18px; padding:18px; border-top:1px solid var(--seam); background:var(--ledger); }

    /* 8: Priority gap */
    .gap-layout { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr); min-height:620px; }
    .gap-chart { padding:24px; border-right:1px solid var(--seam); }
    .gap-chart h3,.gap-editor h3 { margin:0 0 18px; font:650 22px Georgia,serif; }
    .gap-row { display:grid; grid-template-columns:190px 1fr 64px; align-items:center; gap:14px; min-height:62px; border-top:1px solid var(--seam); }
    .gap-bars { display:grid; gap:5px; }
    .gap-bar { height:7px; background:var(--ledger); }
    .gap-bar i { display:block; height:100%; }
    .gap-bar.priority i { background:var(--blue); }
    .gap-bar.attention i { background:var(--green); }
    .gap-delta { color:var(--ochre); font-size:12px; text-align:right; }
    .gap-editor { padding:24px; background:var(--ledger); }

    /* 9: Briefing */
    .briefing { padding:26px; }
    .briefing-lead { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(260px,.75fr); gap:30px; padding-bottom:24px; border-bottom:1px solid var(--seam); }
    .briefing-lead h3 { margin:0 0 9px; max-width:18ch; font:650 clamp(30px,4vw,52px)/1.02 Georgia,serif; letter-spacing:-.03em; }
    .briefing-lead p { max-width:65ch; color:var(--secondary); line-height:1.6; }
    .briefing-note { align-self:start; padding:18px; color:var(--canvas); border-radius:var(--radius); background:var(--rail); }
    .briefing-note strong { display:block; margin-bottom:7px; }
    .briefing-decisions { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; margin-top:24px; background:var(--seam); border:1px solid var(--seam); }
    .briefing-card { min-height:230px; padding:20px; background:var(--canvas); }
    .briefing-card h4 { margin:12px 0 8px; font:650 20px/1.22 Georgia,serif; }
    .briefing-card p { color:var(--secondary); font-size:var(--text-body); line-height:1.5; }
    .briefing-card button { min-height:42px; padding:0; border:0; color:var(--green); background:transparent; font-weight:750; }

    /* 10: Domain lanes */
    .lanes { padding:0 20px 20px; }
    .lane { display:grid; grid-template-columns:190px minmax(0,1fr); border-bottom:1px solid var(--seam); }
    .lane-name { padding:22px 12px 22px 0; }
    .lane-name h3 { margin:0 0 5px; font:650 19px Georgia,serif; }
    .lane-track { display:flex; gap:8px; overflow-x:auto; padding:15px 0; }
    .lane-branch { flex:0 0 230px; min-height:122px; padding:14px; border:1px solid var(--seam); border-radius:var(--radius); background:var(--ledger); }
    .lane-branch.selected { border-color:var(--green); background:var(--lichen); }
    .lane-branch h4 { margin:6px 0 12px; font:650 16px/1.25 Georgia,serif; }
    .lane-editor { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:24px; padding:22px 20px; border-top:1px solid var(--seam); background:var(--ledger); }

    .selection-toast { position:fixed; z-index:30; right:18px; bottom:18px; display:none; max-width:340px; padding:13px 16px; border:1px solid var(--green); border-radius:8px; color:var(--canvas); background:var(--rail); box-shadow:var(--shadow); }
    .selection-toast.show { display:block; }
    @media (max-width:980px) {
      .decision-layout,.review-focus,.triple,.gap-layout { grid-template-columns:1fr; }
      .decision-list,.gap-chart { border-right:0; border-bottom:1px solid var(--seam); }
      .review-steps { display:none; }
      .review-context,.triple-signals { border-left:0; border-top:1px solid var(--seam); }
      .triple-index { border-right:0; }
      .triple-index .plain-list { display:flex; overflow-x:auto; }
      .triple-index li { flex:0 0 220px; }
      .matrix { grid-template-columns:repeat(2,1fr); }
      .band { grid-template-columns:1fr; }
      .band-label { border-bottom:1px solid var(--seam); }
      .band-items { grid-template-columns:repeat(3,minmax(220px,1fr)); overflow-x:auto; }
      .briefing-decisions { grid-template-columns:1fr; }
    }
    @media (max-width:700px) {
      .lab-head { position:static; }
      .lab-intro,.variant-head { align-items:start; flex-direction:column; }
      main { padding:20px 12px 92px; }
      .variant-actions { width:100%; justify-content:space-between; }
      .choice { flex:1; }
      .surface-bar { align-items:stretch; flex-direction:column; }
      .search { width:100%; }
      .decision-layout { grid-template-columns:1fr; }
      .decision-detail,.review-main,.triple-dossier,.gap-chart,.gap-editor,.briefing { padding:18px; }
      .decision-summary,.signal-strip { grid-template-columns:repeat(2,1fr); }
      .matrix { grid-template-columns:1fr; }
      .matrix-drawer,.edit-grid,.briefing-lead,.lane-editor { grid-template-columns:1fr; }
      .matrix-action-strip { grid-template-columns:1fr; }
      .matrix-action-strip .branch-decision-actions { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .branch-decision-actions { grid-template-columns:1fr; }
      .triple-signals { order:2; }
      .triple-dossier { order:3; }
      .review-focus { display:block; }
      .review-context { padding:18px; }
      .comparison { grid-template-columns:1fr; }
      .triple { display:flex; flex-direction:column; }
      .attention-field { padding:12px; }
      .attention-row { grid-template-columns:1fr 58px; gap:8px; padding:12px 0; }
      .attention-track { grid-column:1/-1; grid-row:2; }
      .attention-row .inline-action { grid-column:1/-1; }
      .register-editor { grid-template-columns:1fr; }
      .lane { grid-template-columns:1fr; }
      .lane-name { padding-bottom:8px; }
    }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <div class="lab">
    <header class="lab-head">
      <div class="lab-intro"><div><h1>One review desk, 10 structures</h1></div><p>Branches and Balance become one place to decide what needs attention, inspect why, and change branch scope, priority, or status without switching context. All examples use current production branches and signals.</p></div>
      <div class="switcher" role="tablist" aria-label="Review desk design variations">
        <button role="tab" aria-selected="true" data-show="1">1 Decisions</button><button role="tab" aria-selected="false" data-show="2">2 Matrix</button><button role="tab" aria-selected="false" data-show="3">3 Review queue</button><button role="tab" aria-selected="false" data-show="4">4 Dossier</button><button role="tab" aria-selected="false" data-show="5">5 Bands</button><button role="tab" aria-selected="false" data-show="6">6 Attention</button><button role="tab" aria-selected="false" data-show="7">7 Register</button><button role="tab" aria-selected="false" data-show="8">8 Priority gap</button><button role="tab" aria-selected="false" data-show="9">9 Briefing</button><button role="tab" aria-selected="false" data-show="10">10 Lanes</button>
      </div>
    </header>
    <main id="variants"></main>
  </div>
  <output class="selection-toast" aria-live="polite"></output>
  <script>
    const branches = [
      {name:'Tazkiyah & Character',domain:'Faith & Character',priority:1,attention:10.9,sources:301,notes:0,units:14,state:'stable',last:'Aug 23',scope:'Purifying the heart and building sincere, patient, disciplined character through trusted Sunni teaching and direct practice.'},
      {name:'Hadith Verification',domain:'Faith & Character',priority:2,attention:1.8,sources:1,notes:0,units:6,state:'uncovered',last:'Aug 21',scope:'Verify hadith wording, source, grading, and practical meaning using trusted Arabic references.'},
      {name:'Systems Thinking',domain:'Systems & Craft',priority:3,attention:7.3,sources:50,notes:0,units:10,state:'stable',last:'Aug 17',scope:'Explain behavior through boundaries, relationships, feedback, stocks and flows, delays, leverage, and unintended consequences.'},
      {name:'Small-Business Foundations',domain:'Business & Money',priority:4,attention:10.9,sources:6,notes:1,units:12,state:'stable',last:'Aug 17',scope:'Validate demand, shape the offer, price it, operate simply, and protect cash before opening a real small business.'},
      {name:'Persuasion & Influence',domain:'Mind & People',priority:5,attention:10.9,sources:8,notes:7,units:8,state:'stable',last:'Aug 15',scope:'Understand how people change their minds and communicate persuasively without coercion.'},
      {name:'Decision-Making & Cognitive Biases',domain:'Mind & People',priority:null,attention:14.5,sources:14,notes:9,units:2,state:'stable',last:'Aug 20',scope:'Improve judgment under uncertainty through causal reasoning, forecasting, calibration, and bias-aware choices.'},
      {name:'Mental Health',domain:'Body & Mind',priority:null,attention:0,sources:0,notes:0,units:0,state:'uncovered',last:'Never',scope:'Understand mental health mechanisms and practical self-care through credible, research-grounded material.'},
      {name:'Personal Knowledge Systems',domain:'Systems & Craft',priority:null,attention:0,sources:0,notes:0,units:0,state:'uncovered',last:'Never',scope:'Design durable capture, reading, note, retrieval, and knowledge-organization workflows.'},
      {name:'Visual Learning & Educational UX',domain:'Systems & Craft',priority:null,attention:0,sources:1,notes:0,units:0,state:'uncovered',last:'Never',scope:'Make difficult material easier to understand through information design, explanatory visuals, and usable learning interfaces.'},
      {name:'Mortality & Life Design',domain:'Life & Relationships',priority:null,attention:5.5,sources:6,notes:2,units:0,state:'stable',last:'Aug 19',scope:'Use existential and philosophical work on death, meaning, trade-offs, and finitude to make clearer life decisions.'},
      {name:'Negotiation & Sales',domain:'Business & Money',priority:null,attention:1.8,sources:7,notes:0,units:3,state:'uncovered',last:'Aug 16',scope:'Prepare, uncover interests, make offers, protect boundaries, and reach durable agreements.'},
      {name:'Linux & Automation',domain:'Systems & Craft',priority:null,attention:1.8,sources:1,notes:0,units:0,state:'archived',last:'Aug 11',scope:'Build reliable Fedora, GNOME, shell, and local automation workflows.'}
    ]
    const selected = branches[1]
    const status = b => b.priority ? `<span class="state priority">Priority ${b.priority}</span>` : `<span class="state ${b.state}">${b.state === 'stable' ? 'Active' : b.state === 'archived' ? 'Archived' : 'Needs attention'}</span>`
    const meter = b => `<div class="meter"><i style="width:${Math.min(100,b.attention*6)}%"></i></div>`
    const editor = b => `<div class="edit-grid"><label class="field"><span>Status</span><select><option>Active</option><option>Paused</option><option>Archived</option></select></label><label class="field"><span>Priority</span><select><option>${b.priority ? `Priority ${b.priority}` : 'Not prioritized'}</option><option>Make first priority</option><option>Remove priority</option></select></label><label class="field wide"><span>Purpose and scope</span><textarea>${b.scope}</textarea></label><label class="field wide"><span>Topics</span><input value="source tracing, grading, scholar rulings, responsible sharing"></label></div>`
    const branchActions = (compact = false) => `<section class="branch-decision ${compact ? 'is-compact' : ''}" aria-label="Branch decision"><div class="branch-decision-head"><div><strong>Branch decision</strong><span class="meta decision-current">Currently priority 2 and active</span></div></div><div class="branch-decision-actions"><button type="button" class="is-keep" data-state-label="Active">Keep active</button><button type="button" class="is-priority is-selected" data-state-label="First priority" aria-pressed="true">Make first priority</button><button type="button" class="is-pause" data-state-label="Paused">Pause branch</button><button type="button" class="is-archive" data-state-label="Archived">Archive branch</button></div></section>`
    const head = (n,title,desc,label) => `<header class="variant-head"><div><h2>${title}</h2><p>${desc}</p></div><div class="variant-actions"><span class="tag">${label}</span><button class="choice" data-choose="${n}" type="button">Choose direction ${n}</button></div></header>`
    const bar = title => `<div class="surface-bar"><strong class="surface-title">${title}</strong><div class="tools"><input class="search" aria-label="Search branches" placeholder="Search branches or topics"><button class="tool active">Needs attention</button><button class="tool">All 22</button><button class="tool">New branch</button></div></div>`

    const v1 = `<section class="variant active" data-variant="1">${head(1,'Decision ledger','A ranked attention queue on the left and a complete inline branch workspace on the right. The fastest route from signal to decision, and the recommended production direction.','Recommended')}<div class="surface">${bar('Branch review')}<div class="decision-layout"><section class="decision-list"><div class="decision-summary"><div><strong>3</strong><span class="meta">need a decision</span></div><div><strong>5</strong><span class="meta">priorities</span></div><div><strong>100%</strong><span class="meta">mapped</span></div></div>${[branches[1],branches[6],branches[7],branches[8],branches[5]].map((b,i)=>`<button class="decision-row ${i===0?'active':''}"><span class="decision-rank">${i+1}</span><span class="decision-copy"><strong>${b.name}</strong><span class="meta">${b.domain} · ${b.attention}% attention</span></span>${status(b)}</button>`).join('')}</section><article class="decision-detail"><div class="detail-lead"><div class="status-row"><span class="tag">Faith & Character</span>${status(selected)}</div><h3>${selected.name}</h3><p>${selected.scope}</p></div><div class="signal-strip"><div><strong>1.8%</strong><span class="meta">attention</span></div><div><strong>1</strong><span class="meta">source</span></div><div><strong>6</strong><span class="meta">units</span></div><div><strong>Aug 21</strong><span class="meta">last touched</span></div></div>${editor(selected)}</article></div></div></section>`

    const domains = ['Faith & Character','Systems & Craft','Business & Money','Mind & People','Life & Relationships','Body & Mind']
    const v2 = `<section class="variant" data-variant="2">${head(2,'Domain matrix','All six domains stay visible at once. Each cell exposes branch attention and opens a shared inline editor below, making portfolio imbalance easy to see without a chart.','Overview first')}<div class="surface">${bar('Knowledge field')}<div class="matrix-action-strip"><div><div class="status-row"><span class="tag">Faith & Character</span>${status(selected)}</div><h3 class="branch-title" style="margin-top:8px">${selected.name}</h3><span class="meta">Selected branch · 1.8% attention</span></div>${branchActions()}</div><div class="matrix">${domains.map(d=>`<section class="domain"><header class="domain-head"><h3>${d}</h3><span class="meta">${branches.filter(b=>b.domain===d).length} shown</span></header>${branches.filter(b=>b.domain===d).slice(0,3).map(b=>`<div class="domain-row"><button><strong>${b.name}</strong><span class="meta">${b.sources} sources · ${b.last}</span></button><div><span class="mono">${b.attention}%</span>${meter(b)}</div></div>`).join('')||'<p class="meta">No sample branches</p>'}</section>`).join('')}</div><div class="matrix-drawer"><div><h3 class="branch-title">Edit branch scope</h3><p class="muted">Refine what belongs in this branch without changing its current map decision.</p></div>${editor(selected)}</div></div></section>`

    const v3 = `<section class="variant" data-variant="3">${head(3,'Review queue','One branch owns the canvas at a time. Strongest for deliberate weekly review: decide, move forward, and leave the full registry out of the way.','Sequential')}<div class="surface"><div class="review-focus"><aside class="review-steps"><h3>Weekly review</h3><div class="review-step current"><span>1</span><span>Priority fit</span></div><div class="review-step"><span>2</span><span>Scope</span></div><div class="review-step"><span>3</span><span>Status</span></div><div class="review-step"><span>4</span><span>Next branch</span></div><p class="meta" style="color:var(--lichen);margin-top:30px">Branch 1 of 3 needing a decision</p></aside><main class="review-main"><div class="status-row"><span class="tag">Faith & Character</span>${status(selected)}</div><h3>${selected.name}</h3><p>${selected.scope}</p><div class="comparison"><div><span class="meta">Priority expectation</span><strong>#2</strong></div><span class="muted">compared with</span><div><span class="meta">90-day attention</span><strong>1.8%</strong></div></div><div class="review-actions"><button class="primary">Keep as priority</button><button>Make first priority</button><button>Pause</button><button>Edit scope</button></div></main><aside class="review-context"><h4>Decision context</h4><div class="context-item"><span class="meta">Why it surfaced</span><p>High priority with low recent attention.</p></div><div class="context-item"><span class="meta">Existing material</span><p>1 source · 6 knowledge units · 0 notes</p></div><div class="context-item"><span class="meta">Last touched</span><p>Aug 21, 2026</p></div><button class="inline-action">Open filed items</button></aside></div></div></section>`

    const v4 = `<section class="variant" data-variant="4">${head(4,'Branch dossier','A compact index, a deep editable dossier, and a persistent decision rail. Best when branch scope, filed material, and branch status need to remain visible together.','Deep inspection')}<div class="surface">${bar('Branch dossier')}<div class="triple"><aside class="triple-index"><div class="pane-head">Branch index</div><ul class="plain-list">${branches.slice(0,7).map((b,i)=>`<li><button class="index-item ${i===1?'active':''}"><strong>${b.name}</strong><span>${b.domain} · ${b.attention}% attention</span></button></li>`).join('')}</ul></aside><main class="triple-dossier"><div class="status-row"><span class="tag">Faith & Character</span>${status(selected)}</div><h3>${selected.name}</h3><p class="muted">${selected.scope}</p><div class="topic-list"><span class="pill">Source tracing</span><span class="pill">Hadith grading</span><span class="pill">Scholar rulings</span><span class="pill">Responsible sharing</span></div>${editor(selected)}</main><aside class="triple-signals"><div class="pane-head">Signals and decision</div>${branchActions(true)}<div class="signal-block"><span class="meta">Attention, 90 days</span><strong>1.8%</strong>${meter(selected)}</div><div class="signal-block"><span class="meta">Filed here</span><strong>1 source</strong><span class="meta">6 units · 0 notes</span></div><div class="signal-block"><span class="meta">Priority alignment</span><strong>Low</strong><span class="meta">Priority 2 receives less attention than four unranked branches.</span></div><div class="signal-block"><button class="inline-action">View everything filed here</button></div></aside></div></div></section>`

    const bandData = [['Decide now','Priority and attention disagree',[branches[1],branches[6],branches[7]]],['Watch','Active, but becoming quiet',[branches[10],branches[8],branches[4]]],['In rhythm','Attention currently fits intent',[branches[0],branches[2],branches[3]]],['Outside active map','Paused or archived',[branches[11]]]]
    const v5 = `<section class="variant" data-variant="5">${head(5,'Review bands','Branches are grouped by the decision they require rather than by status or domain. The whole registry becomes a calm sequence from urgent judgment to stable background.','Decision states')}<div class="surface">${bar('Branch review')}<div class="bands">${bandData.map(([label,desc,items])=>`<section class="band"><header class="band-label"><h3>${label}</h3><p>${desc}</p></header><div class="band-items">${items.map(b=>`<article class="band-item">${status(b)}<h4>${b.name}</h4><p class="meta">${b.attention}% attention · ${b.sources} sources</p><button>Edit branch and signals</button></article>`).join('')}</div></section>`).join('')}</div></div></section>`

    const v6 = `<section class="variant" data-variant="6">${head(6,'Attention field','The registry itself becomes the visualization. Every row compares current attention against the priority target, then exposes the branch action directly.','Signal first')}<div class="surface">${bar('Attention field')}<div class="attention-field"><div class="meta" style="margin-bottom:12px">Green is actual attention. The thin red marker is the expected share for ranked priorities.</div>${branches.slice(0,10).sort((a,b)=>b.attention-a.attention).map(b=>`<div class="attention-row"><div class="attention-name"><strong>${b.name}</strong><span class="meta">${b.domain}${b.priority?` · Priority ${b.priority}`:''}</span></div><div class="attention-track"><i style="width:${Math.min(100,b.attention*5.5)}%"></i>${b.priority?`<span class="attention-target" style="left:${Math.max(18,72-b.priority*8)}%"></span>`:''}</div><div class="attention-value mono">${b.attention}%</div><button class="inline-action">Review</button></div>`).join('')}</div></div></section>`

    const v7 = `<section class="variant" data-variant="7">${head(7,'Branch register','A dense, sortable operating register with one expanding editor. Maximum comparison per viewport and the most efficient option for frequent branch maintenance.','Operational')}<div class="surface">${bar('Branch register')}<div class="register-wrap"><table class="register"><thead><tr><th>Branch</th><th>Domain</th><th>Status</th><th>Priority</th><th>Attention</th><th>Sources</th><th>Notes</th><th>Units</th><th>Last</th><th></th></tr></thead><tbody>${branches.slice(0,9).map((b,i)=>`<tr class="${i===1?'selected':''}"><td><strong>${b.name}</strong></td><td>${b.domain}</td><td>${b.state==='stable'?'Active':b.state}</td><td>${b.priority||'—'}</td><td class="mono">${b.attention}%</td><td>${b.sources}</td><td>${b.notes}</td><td>${b.units}</td><td>${b.last}</td><td><button>Edit</button></td></tr>`).join('')}</tbody></table></div><div class="register-editor"><div><strong>${selected.name}</strong><p class="meta">Editing selected row · changes remain inline</p></div><div class="status-row"><button class="inline-action">Make first priority</button><button class="inline-action">Pause</button><button class="inline-action">Edit scope</button></div></div></div></section>`

    const gaps = [branches[1],branches[2],branches[0],branches[3],branches[4]]
    const v8 = `<section class="variant" data-variant="8">${head(8,'Priority gap','A direct comparison of intended importance and actual attention. This makes the central contradiction legible, then turns the selected gap into an editable branch decision.','Alignment')}<div class="surface">${bar('Priority alignment')}<div class="gap-layout"><section class="gap-chart"><h3>Where intention and attention diverge</h3><div class="status-row" style="margin-bottom:16px"><span class="pill" style="color:var(--blue)">Priority weight</span><span class="pill" style="color:var(--green)">Actual attention</span></div>${gaps.map((b,i)=>{const expected=[30,24,19,15,12][i]; return `<div class="gap-row"><div><strong>${b.name}</strong><span class="meta">Priority ${b.priority}</span></div><div class="gap-bars"><div class="gap-bar priority"><i style="width:${expected*2.7}%"></i></div><div class="gap-bar attention"><i style="width:${b.attention*4}%"></i></div></div><span class="gap-delta">${(b.attention-expected).toFixed(1)} pts</span></div>`}).join('')}</section><aside class="gap-editor"><h3>${selected.name}</h3><p class="muted">Priority 2 receives 1.8% of recent attention. Change the priority, pause the branch, or keep the mismatch intentionally.</p>${editor(selected)}<button class="choice" style="margin-top:14px">Save branch decision</button></aside></div></div></section>`

    const v9 = `<section class="variant" data-variant="9">${head(9,'Review briefing','The page opens with a plain-language diagnosis and three consequential decisions, then lets the full branch registry recede. Best for a weekly check-in rather than continuous management.','Guided')}<div class="surface">${bar('Weekly branch briefing')}<div class="briefing"><section class="briefing-lead"><div><h3>Your priorities and attention have drifted apart.</h3><p>All completed sources are mapped, but Hadith Verification is priority 2 with only 1.8% of recent attention. Three active branches have no meaningful activity, while Decision-Making receives the largest share without a priority rank.</p></div><aside class="briefing-note"><strong>Portfolio read</strong><span>55 completed sources · 100% mapped · 5 ranked priorities · 3 decisions ready</span></aside></section><section class="briefing-decisions"><article class="briefing-card"><span class="state priority">Priority mismatch</span><h4>Keep Hadith Verification at priority 2?</h4><p>One source and six units exist, but attention remains low.</p><button>Review and decide</button></article><article class="briefing-card"><span class="state uncovered">No activity</span><h4>Is Mental Health still an active branch?</h4><p>No source, note, or unit is currently filed here.</p><button>Edit, pause, or keep</button></article><article class="briefing-card"><span class="state stable">High attention</span><h4>Should Decision-Making become a priority?</h4><p>It leads recent attention at 14.5% with 14 sources and nine notes.</p><button>Review priority</button></article></section></div></div></section>`

    const laneDomains = domains.map(d=>[d,branches.filter(b=>b.domain===d)])
    const v10 = `<section class="variant" data-variant="10">${head(10,'Domain lanes','Each domain is a horizontal working lane with compact branch dossiers. This preserves the map’s hierarchy while bringing status, attention, and editing into the same continuous surface.','Hierarchy')}<div class="surface">${bar('Knowledge branch lanes')}<div class="lanes">${laneDomains.map(([d,items])=>`<section class="lane"><header class="lane-name"><h3>${d}</h3><span class="meta">${items.length} sample branches</span></header><div class="lane-track">${items.map(b=>`<article class="lane-branch ${b===selected?'selected':''}">${status(b)}<h4>${b.name}</h4><span class="meta">${b.attention}% attention · ${b.sources} sources</span></article>`).join('')}</div></section>`).join('')}</div><div class="lane-editor"><div><div class="status-row"><span class="tag">Faith & Character</span>${status(selected)}</div><h3 class="branch-title" style="margin-top:10px">${selected.name}</h3><p class="muted">${selected.scope}</p></div>${editor(selected)}</div></div></section>`

    document.querySelector('#variants').innerHTML = [v1,v2,v3,v4,v5,v6,v7,v8,v9,v10].join('')
    const buttons = [...document.querySelectorAll('[data-show]')]
    const variants = [...document.querySelectorAll('[data-variant]')]
    const choices = [...document.querySelectorAll('[data-choose]')]
    const toast = document.querySelector('.selection-toast')
    function show(id) {
      buttons.forEach(button => button.setAttribute('aria-selected', String(button.dataset.show === id)))
      variants.forEach(variant => variant.classList.toggle('active', variant.dataset.variant === id))
      history.replaceState(null,'',`#${id}`)
      window.scrollTo({top:0,behavior:'instant'})
    }
    function choose(id) {
      localStorage.setItem('map-review-direction',id)
      choices.forEach(button => { const active=button.dataset.choose===id; button.classList.toggle('selected',active); button.textContent=active?`Direction ${id} selected`:`Choose direction ${button.dataset.choose}` })
      toast.textContent=`Direction ${id} selected. Tell Hermes “use variation ${id}” to build it into Map Review.`
      toast.classList.add('show')
      window.setTimeout(()=>toast.classList.remove('show'),5000)
    }
    buttons.forEach(button => button.addEventListener('click',()=>show(button.dataset.show)))
    choices.forEach(button => button.addEventListener('click',()=>choose(button.dataset.choose)))
    document.querySelectorAll('.branch-decision-actions').forEach(group => group.addEventListener('click', event => {
      const button = event.target.closest('button')
      if (!button) return
      group.querySelectorAll('button').forEach(item => { item.classList.remove('is-selected'); item.setAttribute('aria-pressed','false') })
      button.classList.add('is-selected')
      button.setAttribute('aria-pressed','true')
      const receipt = group.closest('.branch-decision').querySelector('.decision-current')
      receipt.textContent = `${button.dataset.stateLabel} selected for this prototype`
    }))
    const initial=location.hash.slice(1)
    if(buttons.some(button=>button.dataset.show===initial)) show(initial)
    const saved=localStorage.getItem('map-review-direction')
    if(saved && choices.some(button=>button.dataset.choose===saved)) choose(saved)
  </script>
</body>
</html>
