<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Learning Compass — Whole Thread structure lab</title>
  <style>
    :root {
      --ink:#18211c;
      --secondary:#4b5a51;
      --muted:#5f6d64;
      --canvas:#fffdf7;
      --shell:#f1eee6;
      --ledger:#f8f5ee;
      --lichen:#e5eee6;
      --moss:#b9cabd;
      --seam:#d8d2c5;
      --seam-strong:#b8b1a4;
      --cypress:#1f513b;
      --cypress-deep:#143b2b;
      --ochre:#8a4d12;
      --ochre-soft:#f4e8d9;
      --map:#315f76;
      --map-soft:#e4edf1;
      --danger:#8b3026;
      --danger-soft:#f5e6e2;
      --focus:#0d6043;
      --rail:116px;
      --shadow:0 18px 50px rgba(28,43,34,.12);
      --ease:cubic-bezier(.16,1,.3,1);
    }
    * { box-sizing:border-box; }
    html { min-width:320px; background:var(--shell); color:var(--ink); font-family:"IBM Plex Sans","Noto Sans",system-ui,sans-serif; scroll-behavior:smooth; }
    body { margin:0; min-width:320px; }
    button,input,select { font:inherit; }
    button,a,input,select { -webkit-tap-highlight-color:transparent; }
    button { color:inherit; }
    a { color:var(--cypress); text-underline-offset:4px; }
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
    ::selection { background:var(--cypress); color:var(--canvas); }
    * { scrollbar-color:var(--moss) transparent; scrollbar-width:thin; }
    *::-webkit-scrollbar { width:10px; height:10px; }
    *::-webkit-scrollbar-thumb { border:3px solid transparent; border-radius:10px; background:var(--moss); background-clip:padding-box; }
    .skip-link { position:fixed; z-index:100; top:10px; left:10px; padding:12px 16px; border-radius:4px; background:var(--cypress-deep); color:white; transform:translateY(-150%); }
    .skip-link:focus { transform:translateY(0); }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    .lab-header { position:sticky; z-index:30; top:0; padding:18px clamp(16px,3vw,42px) 14px; border-bottom:1px solid var(--seam); background:rgba(255,253,247,.96); box-shadow:0 9px 26px rgba(28,43,34,.06); }
    .lab-copy { display:flex; align-items:end; justify-content:space-between; gap:28px; width:min(1560px,100%); margin:0 auto 14px; }
    .lab-copy h1 { max-width:17ch; margin:0; font:600 clamp(25px,3vw,40px)/1.02 "Literata",Georgia,serif; letter-spacing:-.032em; text-wrap:balance; }
    .lab-copy p { max-width:76ch; margin:0; color:var(--secondary); font-size:13px; line-height:1.55; }
    .direction-tabs { display:flex; gap:6px; width:min(1560px,100%); margin:auto; overflow-x:auto; padding:3px 3px 7px; }
    .direction-tabs button { min-height:44px; flex:0 0 auto; padding:8px 13px; border:1px solid var(--seam); border-radius:5px; background:var(--canvas); color:var(--secondary); font-weight:650; cursor:pointer; white-space:nowrap; }
    .direction-tabs button[aria-selected="true"] { border-color:var(--cypress); background:var(--cypress); color:var(--canvas); }
    .lab-main { width:min(1560px,100%); margin:auto; padding:clamp(22px,4vw,54px); }
    .direction-brief { display:grid; grid-template-columns:minmax(0,1fr) minmax(280px,.65fr); align-items:end; gap:clamp(20px,4vw,54px); margin:0 0 22px; padding-bottom:18px; border-bottom:1px solid var(--seam-strong); }
    .direction-brief h2 { max-width:18ch; margin:0 0 7px; font:600 clamp(28px,3.4vw,48px)/1.02 "Literata",Georgia,serif; letter-spacing:-.035em; text-wrap:balance; }
    .direction-brief p { max-width:72ch; margin:0; color:var(--secondary); line-height:1.6; }
    .brief-tradeoff { display:grid; gap:6px; padding:14px 0 2px 18px; border-left:1px solid var(--seam-strong); }
    .brief-tradeoff strong { color:var(--cypress); font-size:12px; letter-spacing:.02em; }
    .brief-tradeoff span { color:var(--secondary); font-size:13px; line-height:1.5; }

    .compass-shell { display:grid; grid-template-columns:var(--rail) minmax(0,1fr); min-height:900px; border:1px solid var(--seam-strong); border-radius:7px; background:var(--canvas); box-shadow:var(--shadow); overflow:clip; container:prototype / inline-size; }
    .root-rail { position:relative; z-index:3; display:grid; grid-template-rows:auto 1fr auto; min-width:0; padding:19px 12px 14px; border-right:1px solid var(--seam); background:var(--cypress-deep); color:#f7f3e9; }
    .root-brand { display:grid; gap:2px; min-height:62px; padding:5px 6px 15px; border-bottom:1px solid rgba(255,255,255,.22); text-decoration:none; color:inherit; }
    .root-brand strong { font:600 15px/1.05 "Literata",Georgia,serif; letter-spacing:-.015em; }
    .root-brand small { color:#c5d5ca; font-size:9px; letter-spacing:.08em; text-transform:uppercase; }
    .root-nav { display:grid; align-content:start; gap:5px; padding-top:18px; }
    .root-nav a { display:grid; place-items:center; min-height:54px; padding:6px 4px; border:1px solid transparent; border-radius:4px; color:#d7e1da; font-size:11px; font-weight:650; line-height:1.1; text-align:center; text-decoration:none; }
    .root-nav a:hover { border-color:rgba(255,255,255,.26); color:white; }
    .root-nav a[aria-current="page"] { border-color:#d7e1da; background:rgba(255,255,255,.09); color:white; }
    .rail-context { padding:14px 5px 4px; border-top:1px solid rgba(255,255,255,.22); color:#c5d5ca; font-size:10px; line-height:1.45; }
    .mobile-dock { display:none; }
    .workspace { min-width:0; background:var(--canvas); }
    .workspace-topline { display:flex; min-height:45px; align-items:center; justify-content:space-between; gap:18px; padding:8px clamp(16px,3vw,34px); border-bottom:1px solid var(--seam); background:var(--ledger); }
    .breadcrumbs { display:flex; min-width:0; align-items:center; gap:8px; color:var(--muted); font-size:12px; white-space:nowrap; }
    .breadcrumbs a { flex:0 0 auto; }
    .breadcrumbs span:last-child { min-width:0; overflow:hidden; text-overflow:ellipsis; }
    .branch-pill { display:inline-flex; min-height:28px; align-items:center; padding:4px 9px; border:1px solid var(--moss); border-radius:999px; color:var(--cypress); font-size:11px; font-weight:650; white-space:nowrap; }

    .thread-spine { display:grid; grid-template-columns:minmax(0,1fr) minmax(250px,340px); gap:clamp(22px,4vw,56px); padding:clamp(24px,4vw,48px) clamp(18px,4vw,48px) 24px; border-bottom:1px solid var(--seam); }
    .thread-title { max-width:24ch; margin:0 0 11px; font:600 clamp(29px,4vw,55px)/1.02 "Literata",Georgia,serif; letter-spacing:-.038em; overflow-wrap:anywhere; text-wrap:balance; }
    .guiding-question { max-width:72ch; margin:0; color:var(--secondary); font:400 clamp(14px,1.5vw,17px)/1.65 "Literata",Georgia,serif; }
    .spine-progress { display:grid; align-content:start; gap:12px; padding:4px 0; }
    .spine-position { display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding-bottom:10px; border-bottom:1px solid var(--seam); }
    .spine-position strong { font:600 22px/1 "IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }
    .spine-position span { color:var(--secondary); font-size:12px; }
    .progress-track { height:5px; border-radius:999px; background:var(--seam); overflow:hidden; }
    .progress-track i { display:block; width:1.4%; height:100%; background:var(--cypress); }
    .current-level { display:grid; gap:4px; }
    .current-level strong { font-size:14px; }
    .current-level span { color:var(--secondary); font-size:12px; }
    .spine-action { display:flex; min-height:48px; align-items:center; justify-content:space-between; gap:14px; padding:10px 14px; border:1px solid var(--cypress); border-radius:5px; background:var(--cypress); color:white; text-align:left; cursor:pointer; }
    .spine-action span { display:grid; gap:2px; }
    .spine-action small { color:#cfe0d5; font-size:10px; font-weight:650; letter-spacing:.03em; text-transform:uppercase; }
    .spine-action strong { font-size:13px; line-height:1.3; }
    .spine-rule { margin:0; color:var(--muted); font-size:11px; line-height:1.45; }
    .thread-sections { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border-bottom:1px solid var(--seam-strong); background:var(--ledger); }
    .thread-sections button { position:relative; min-height:50px; border:0; border-right:1px solid var(--seam); background:transparent; color:var(--secondary); font-weight:680; cursor:pointer; }
    .thread-sections button:last-child { border-right:0; }
    .thread-sections button:hover { background:var(--lichen); color:var(--cypress); }
    .thread-sections button[aria-current="page"] { background:var(--canvas); color:var(--cypress-deep); }
    .thread-sections button[aria-current="page"]::after { position:absolute; right:18px; bottom:-1px; left:18px; height:2px; background:var(--cypress); content:""; }
    .view-area { min-height:580px; padding:clamp(20px,3.4vw,42px); animation:view-settle 420ms var(--ease) both; }
    @keyframes view-settle { from { opacity:.75; transform:translateY(7px); clip-path:inset(0 0 8px 0); } to { opacity:1; transform:none; clip-path:inset(0); } }
    @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } .view-area { animation:none; } }

    .view-head { display:flex; align-items:end; justify-content:space-between; gap:22px; margin-bottom:22px; padding-bottom:13px; border-bottom:1px solid var(--seam); }
    .view-head h2 { margin:0 0 5px; font:600 clamp(24px,3vw,36px)/1.08 "Literata",Georgia,serif; letter-spacing:-.027em; }
    .view-head p { max-width:68ch; margin:0; color:var(--secondary); font-size:13px; line-height:1.55; }
    .count-line { flex:0 0 auto; color:var(--muted); font:600 12px/1.2 "IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }
    .surface { border:1px solid var(--seam); border-radius:5px; background:var(--canvas); }
    .surface + .surface { margin-top:18px; }
    .section-title { margin:0; font:600 clamp(20px,2.3vw,29px)/1.15 "Literata",Georgia,serif; letter-spacing:-.022em; overflow-wrap:anywhere; }
    .copy { max-width:72ch; color:var(--secondary); line-height:1.62; }
    .meta { color:var(--muted); font-size:12px; line-height:1.45; }
    .mono { font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }
    .state { display:inline-flex; min-height:28px; align-items:center; justify-content:center; padding:3px 9px; border:1px solid var(--seam-strong); border-radius:999px; color:var(--secondary); font-size:11px; font-weight:680; white-space:nowrap; }
    .state.current,.state.ready { border-color:var(--moss); background:var(--lichen); color:var(--cypress-deep); }
    .state.needs { border-color:#d6b58f; background:var(--ochre-soft); color:#713c0e; }
    .state.approved { border-color:#a9c8b2; background:var(--lichen); color:var(--cypress); }
    .state.rejected { border-color:#d5aaa2; background:var(--danger-soft); color:var(--danger); }
    .action,.quiet-action,.level-select,.lesson-select { min-height:44px; border:1px solid var(--seam-strong); border-radius:4px; background:var(--canvas); color:var(--cypress); font-weight:680; cursor:pointer; }
    .action { display:inline-flex; align-items:center; justify-content:center; padding:8px 14px; }
    .action.primary { border-color:var(--cypress); background:var(--cypress); color:white; }
    .action:hover,.quiet-action:hover,.level-select:hover,.lesson-select:hover { border-color:var(--cypress); background:var(--lichen); }
    .action.primary:hover { background:var(--cypress-deep); color:white; }
    button:disabled { opacity:.48; cursor:not-allowed; }
    .control-row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
    .filters { display:flex; flex-wrap:wrap; gap:7px; }
    .filter { min-height:44px; padding:7px 12px; border:1px solid var(--seam); border-radius:999px; background:var(--canvas); color:var(--secondary); font-weight:650; cursor:pointer; }
    .filter[aria-pressed="true"] { border-color:var(--cypress); background:var(--lichen); color:var(--cypress-deep); }
    .search-field { display:grid; gap:6px; min-width:min(100%,280px); }
    .search-field span { color:var(--secondary); font-size:12px; font-weight:650; }
    .search-field input { width:100%; min-height:44px; padding:8px 12px; border:1px solid var(--seam-strong); border-radius:4px; background:var(--canvas); color:var(--ink); }
    .curriculum-search,.material-controls { margin-bottom:18px; }
    .space-top-sm { margin-top:18px; }
    .space-top-md { margin-top:24px; }
    .space-top-lg { margin-top:28px; }
    .space-bottom-xs { margin-bottom:8px; }
    .quiet-action.bare-action { border:0; text-align:left; }
    .empty { padding:34px; border:1px dashed var(--seam-strong); color:var(--secondary); text-align:center; }
    .non-gating { padding:11px 14px; border:1px solid var(--moss); border-radius:4px; background:var(--lichen); color:var(--cypress-deep); font-size:12px; line-height:1.5; }
    .level-select,.lesson-select { width:100%; padding:9px 11px; text-align:left; }
    .level-select[aria-current="true"],.lesson-select[aria-current="true"] { border-color:var(--cypress); background:var(--lichen); color:var(--cypress-deep); }
    .level-line { display:flex; min-width:0; align-items:center; justify-content:space-between; gap:12px; }
    .level-line strong { min-width:0; overflow-wrap:anywhere; }
    .level-line .mono { flex:0 0 auto; }
    .lesson-row { display:grid; grid-template-columns:42px minmax(0,1fr) auto; align-items:center; gap:12px; min-height:58px; padding:8px 12px; border-bottom:1px solid var(--seam); }
    .lesson-row:last-child { border-bottom:0; }
    .lesson-row.current { background:var(--lichen); }
    .lesson-row button { display:block; min-height:44px; padding:6px 0; border:0; background:transparent; color:var(--ink); font-weight:650; text-align:left; cursor:pointer; overflow-wrap:anywhere; }
    .lesson-index { color:var(--muted); font:600 11px "IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }
    .lesson-source { color:var(--muted); font-size:11px; white-space:nowrap; }
    .level-summary { display:grid; grid-template-columns:64px minmax(0,1fr) auto; align-items:center; gap:16px; min-height:82px; padding:13px 16px; border-bottom:1px solid var(--seam); }
    .level-summary:last-child { border-bottom:0; }
    .level-summary h3 { margin:0 0 4px; font:600 18px/1.2 "Literata",Georgia,serif; }
    .level-number { color:var(--cypress); font:600 20px "IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }
    .level-actions { display:flex; align-items:center; gap:8px; }
    .project-row,.material-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:18px; padding:16px; border-bottom:1px solid var(--seam); }
    .project-row:last-child,.material-row:last-child { border-bottom:0; }
    .project-row h3,.material-row h3 { margin:0 0 5px; font:600 17px/1.25 "Literata",Georgia,serif; overflow-wrap:anywhere; }
    .project-row p,.material-row p { max-width:74ch; margin:0; color:var(--secondary); font-size:13px; line-height:1.55; }
    .material-row [dir="rtl"] { font-family:"Noto Sans Arabic","IBM Plex Sans",sans-serif; text-align:right; }
    .material-owner { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
    .owner-pill { display:inline-flex; min-height:27px; align-items:center; padding:3px 8px; border:1px solid var(--seam); border-radius:999px; color:var(--secondary); font-size:10px; }
    .stats-line { display:flex; flex-wrap:wrap; gap:1px; border:1px solid var(--seam); background:var(--seam); }
    .stat-cell { flex:1 1 120px; min-width:0; padding:13px 15px; background:var(--ledger); }
    .stat-cell strong { display:block; margin-bottom:3px; font:600 17px "IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }
    .stat-cell span { color:var(--secondary); font-size:11px; }

    /* 1 — Vertical journey */
    .vertical-focus { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(250px,.75fr); gap:1px; background:var(--seam); }
    .vertical-focus > * { padding:clamp(18px,3vw,30px); background:var(--canvas); }
    .vertical-focus h3 { margin:0 0 8px; font:600 clamp(23px,2.6vw,34px)/1.12 "Literata",Georgia,serif; }
    .journey { position:relative; margin-top:20px; padding-left:36px; }
    .journey::before { position:absolute; top:18px; bottom:18px; left:15px; width:1px; background:var(--seam-strong); content:""; }
    .journey-level { position:relative; padding:0 0 22px; }
    .journey-level::before { position:absolute; top:14px; left:-26px; width:9px; height:9px; border:1px solid var(--cypress); border-radius:50%; background:var(--canvas); content:""; }
    .journey-level.current::before { background:var(--cypress); }
    .journey-head { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:14px; min-height:44px; padding:4px 0; }
    .journey-head button { min-height:44px; border:0; background:transparent; color:var(--ink); font:600 18px/1.2 "Literata",Georgia,serif; text-align:left; cursor:pointer; }
    .journey-body { margin-top:8px; border:1px solid var(--seam); background:var(--canvas); }
    .journey-project { margin-top:8px; padding:12px; border-top:1px solid var(--seam); color:var(--secondary); font-size:12px; }

    /* 2 — Split workbench */
    .workbench { display:grid; grid-template-columns:minmax(170px,220px) minmax(0,1fr) minmax(210px,280px); min-height:560px; border:1px solid var(--seam); }
    .workbench-nav,.workbench-inspector { padding:15px; background:var(--ledger); }
    .workbench-nav { border-right:1px solid var(--seam); }
    .workbench-inspector { border-left:1px solid var(--seam); }
    .workbench-canvas { min-width:0; padding:clamp(18px,3vw,30px); }
    .workbench h3 { margin:0 0 13px; font:600 18px/1.2 "Literata",Georgia,serif; }
    .workbench-nav .level-select { margin-bottom:6px; }
    .inspector-block { padding:13px 0; border-bottom:1px solid var(--seam); }
    .inspector-block:last-child { border-bottom:0; }
    .inspector-block strong { display:block; margin-bottom:5px; font-size:12px; }

    /* 3 — Level accordion */
    .accordion { border-top:1px solid var(--seam); }
    .accordion-item { border-bottom:1px solid var(--seam); }
    .accordion-trigger { display:grid; grid-template-columns:62px minmax(0,1fr) auto; align-items:center; gap:14px; width:100%; min-height:70px; padding:10px 14px; border:0; background:var(--canvas); text-align:left; cursor:pointer; }
    .accordion-trigger:hover { background:var(--ledger); }
    .accordion-trigger[aria-expanded="true"] { background:var(--lichen); }
    .accordion-trigger strong { font:600 18px/1.2 "Literata",Georgia,serif; }
    .accordion-panel { padding:0 14px 16px 90px; background:var(--lichen); }
    .accordion-panel .surface { background:var(--canvas); }
    .accordion-panel .copy { margin-top:0; }

    /* 4 — Outline + detail */
    .outline-detail { display:grid; grid-template-columns:minmax(230px,310px) minmax(0,1fr); min-height:580px; border:1px solid var(--seam); }
    .outline-tree { padding:16px; border-right:1px solid var(--seam); background:var(--ledger); }
    .outline-tree h3,.detail-sheet h3 { margin:0 0 14px; font:600 20px/1.2 "Literata",Georgia,serif; }
    .outline-branch { margin-bottom:8px; }
    .outline-lessons { display:grid; gap:3px; margin:5px 0 10px 18px; padding-left:10px; border-left:1px solid var(--seam-strong); }
    .outline-lessons button { min-height:44px; border:0; background:transparent; color:var(--secondary); font-size:12px; text-align:left; cursor:pointer; overflow-wrap:anywhere; }
    .outline-lessons button:hover,.outline-lessons button[aria-current="true"] { color:var(--cypress); text-decoration:underline; text-underline-offset:4px; }
    .detail-sheet { min-width:0; padding:clamp(20px,4vw,42px); }
    .detail-sheet .section-title { max-width:25ch; font-size:clamp(27px,3.4vw,45px); }
    .detail-facts { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin-top:25px; border-top:1px solid var(--seam); border-bottom:1px solid var(--seam); }
    .detail-facts div { padding:13px; border-right:1px solid var(--seam); }
    .detail-facts div:last-child { border-right:0; }

    /* 5 — Command stack */
    .command-stack { display:grid; gap:12px; }
    .command-band { display:grid; grid-template-columns:minmax(150px,.3fr) minmax(0,1fr); border:1px solid var(--seam); }
    .command-band > header { padding:18px; border-right:1px solid var(--seam); background:var(--ledger); }
    .command-band > header h3 { margin:0 0 5px; font:600 20px/1.15 "Literata",Georgia,serif; }
    .command-body { min-width:0; padding:18px; }
    .command-band.now { border-color:var(--moss); }
    .command-band.now > header { background:var(--lichen); }
    .future-strip { display:grid; grid-template-columns:repeat(6,minmax(150px,1fr)); gap:1px; overflow-x:auto; background:var(--seam); }
    .future-strip button { min-width:150px; min-height:106px; padding:13px; border:0; background:var(--canvas); text-align:left; cursor:pointer; }
    .future-strip button:hover { background:var(--ledger); }

    /* 6 — Milestone timeline */
    .timeline-axis { display:grid; grid-template-columns:repeat(7,minmax(130px,1fr)); overflow-x:auto; border:1px solid var(--seam); background:var(--seam); }
    .timeline-axis.owner-axis { grid-template-columns:repeat(3,minmax(190px,1fr)); }
    .milestone { min-width:130px; padding:16px 13px; border:0; background:var(--canvas); text-align:left; cursor:pointer; }
    .milestone + .milestone { border-left:1px solid var(--seam); }
    .milestone[aria-current="true"] { background:var(--lichen); }
    .milestone strong { display:block; margin:8px 0 5px; font:600 16px/1.2 "Literata",Georgia,serif; }
    .milestone-detail { display:grid; grid-template-columns:minmax(0,1fr) minmax(250px,.45fr); margin-top:16px; border:1px solid var(--seam); }
    .milestone-main,.milestone-side { padding:clamp(18px,3vw,30px); }
    .milestone-side { border-left:1px solid var(--seam); background:var(--ledger); }
    .checkpoint-list { display:grid; gap:0; margin-top:18px; border-top:1px solid var(--seam); }
    .checkpoint { display:grid; grid-template-columns:36px minmax(0,1fr) auto; gap:12px; align-items:center; min-height:54px; border-bottom:1px solid var(--seam); }

    /* 7 — Thread dossier */
    .dossier { display:grid; grid-template-columns:minmax(150px,220px) minmax(0,1fr); gap:clamp(24px,5vw,72px); max-width:1120px; margin:auto; }
    .dossier-index { align-self:start; padding:13px 0; border-top:1px solid var(--ink); border-bottom:1px solid var(--ink); }
    .dossier-index button { display:block; width:100%; min-height:44px; padding:7px 0; border:0; border-bottom:1px solid var(--seam); background:transparent; color:var(--secondary); text-align:left; cursor:pointer; }
    .dossier-index button:last-child { border-bottom:0; }
    .dossier-index button[aria-current="true"] { color:var(--cypress); font-weight:700; }
    .dossier-page { max-width:78ch; }
    .dossier-page h3 { margin:0 0 18px; font:600 clamp(31px,4vw,55px)/1.02 "Literata",Georgia,serif; letter-spacing:-.038em; text-wrap:balance; }
    .dossier-lede { margin:0 0 28px; color:var(--secondary); font:400 17px/1.72 "Literata",Georgia,serif; }
    .folio-rule { display:flex; justify-content:space-between; gap:18px; margin:28px 0 12px; padding-top:9px; border-top:1px solid var(--ink); font:650 11px "IBM Plex Mono",ui-monospace,monospace; text-transform:uppercase; }
    .folio-entry { display:grid; grid-template-columns:48px minmax(0,1fr) auto; gap:14px; padding:13px 0; border-bottom:1px solid var(--seam); }

    /* 8 — Focus tunnel */
    .focus-tunnel { width:min(760px,100%); margin:auto; }
    .focus-position { display:flex; justify-content:space-between; gap:14px; margin-bottom:12px; color:var(--muted); font:600 11px "IBM Plex Mono",ui-monospace,monospace; }
    .focus-card { padding:clamp(25px,5vw,54px); border:1px solid var(--seam-strong); background:var(--canvas); }
    .focus-card h3 { max-width:19ch; margin:0 0 14px; font:600 clamp(33px,5vw,62px)/1 "Literata",Georgia,serif; letter-spacing:-.04em; text-wrap:balance; overflow-wrap:anywhere; }
    .focus-card .copy { font-size:15px; }
    .focus-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:24px; }
    .position-map { display:grid; grid-template-columns:repeat(7,minmax(36px,1fr)); gap:5px; margin-top:18px; }
    .position-map button { min-height:44px; border:1px solid var(--seam); border-radius:3px; background:var(--ledger); color:var(--secondary); font:650 11px "IBM Plex Mono",ui-monospace,monospace; cursor:pointer; }
    .position-map button[aria-current="true"] { border-color:var(--cypress); background:var(--cypress); color:white; }
    .focus-queue { margin-top:18px; border-top:1px solid var(--seam); }

    /* 9 — Compact ledger */
    .ledger-layout { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr); min-height:570px; border:1px solid var(--seam); }
    .ledger-table-wrap { min-width:0; overflow:auto; }
    .ledger-table { width:100%; min-width:680px; border-collapse:collapse; }
    .ledger-table caption { padding:12px 14px; color:var(--secondary); text-align:left; }
    .ledger-table th { position:sticky; z-index:1; top:0; padding:10px 12px; border-bottom:1px solid var(--seam-strong); background:var(--ledger); color:var(--secondary); font:650 10px "IBM Plex Mono",ui-monospace,monospace; text-align:left; text-transform:uppercase; }
    .ledger-table td { padding:11px 12px; border-bottom:1px solid var(--seam); font-size:12px; vertical-align:middle; }
    .ledger-table tbody tr:hover,.ledger-table tbody tr.selected { background:var(--lichen); }
    .ledger-link { display:flex; min-height:44px; align-items:center; padding:4px 0; border:0; background:transparent; color:var(--ink); font-weight:680; text-align:left; cursor:pointer; overflow-wrap:anywhere; }
    .ledger-link:hover { color:var(--cypress); text-decoration:underline; text-underline-offset:4px; }
    .ledger-inspector { padding:20px; border-left:1px solid var(--seam); background:var(--ledger); }
    .ledger-inspector h3 { margin:0 0 9px; font:600 24px/1.15 "Literata",Georgia,serif; overflow-wrap:anywhere; }

    /* 10 — Overview map + detail sheet */
    .thread-map { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:1px; border:1px solid var(--seam); background:var(--seam); }
    .map-node { position:relative; min-height:128px; padding:16px; border:0; background:var(--canvas); text-align:left; cursor:pointer; }
    .map-node[aria-current="true"] { background:var(--lichen); }
    .map-node:hover { background:var(--ledger); }
    .map-node strong { display:block; margin:8px 0 5px; font:600 18px/1.2 "Literata",Georgia,serif; overflow-wrap:anywhere; }
    .map-node.final { grid-column:span 2; background:var(--ochre-soft); }
    .map-detail { display:grid; grid-template-columns:minmax(0,1fr) minmax(210px,.4fr); margin-top:16px; border-top:1px solid var(--ink); border-bottom:1px solid var(--ink); }
    .map-detail-main { padding:24px 22px 24px 0; }
    .map-detail-side { padding:24px 0 24px 22px; border-left:1px solid var(--seam); }

    .demo-status { position:fixed; z-index:60; right:18px; bottom:18px; max-width:min(420px,calc(100vw - 36px)); padding:11px 14px; border:1px solid var(--cypress); border-radius:4px; background:var(--cypress-deep); color:white; box-shadow:0 14px 34px rgba(20,59,43,.24); font-size:12px; transform:translateY(140%); transition:transform 260ms var(--ease); }
    .demo-status.show { transform:none; }

    @container prototype (max-width:980px) {
      .thread-spine { grid-template-columns:1fr; }
      .workbench { grid-template-columns:190px minmax(0,1fr); }
      .workbench-inspector { grid-column:1/-1; border-top:1px solid var(--seam); border-left:0; }
      .ledger-layout { grid-template-columns:1fr; }
      .ledger-inspector { border-top:1px solid var(--seam); border-left:0; }
      .thread-map { grid-template-columns:repeat(3,minmax(140px,1fr)); }
    }
    @container prototype (max-width:760px) {
      .vertical-focus,.milestone-detail,.map-detail { grid-template-columns:1fr; }
      .milestone-side,.map-detail-side { border-top:1px solid var(--seam); border-left:0; }
      .map-detail-main,.map-detail-side { padding:20px 0; }
      .outline-detail { grid-template-columns:1fr; }
      .outline-tree { border-right:0; border-bottom:1px solid var(--seam); }
      .outline-lessons { display:none; }
      .dossier { grid-template-columns:1fr; }
      .dossier-index { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); padding:0; border:1px solid var(--seam); }
      .dossier-index button { border-right:1px solid var(--seam); border-bottom:0; text-align:center; }
      .command-band { grid-template-columns:1fr; }
      .command-band > header { border-right:0; border-bottom:1px solid var(--seam); }
      .workbench { grid-template-columns:1fr; }
      .workbench-nav { border-right:0; border-bottom:1px solid var(--seam); }
      .workbench-nav .level-list { display:grid; grid-template-columns:repeat(7,minmax(110px,1fr)); gap:5px; overflow-x:auto; }
      .workbench-inspector { grid-column:auto; }
    }
    @media (max-width:820px) {
      .lab-header { position:static; }
      .lab-copy,.direction-brief,.view-head { align-items:start; grid-template-columns:1fr; flex-direction:column; }
      .lab-copy { display:grid; }
      .lab-main { padding:22px 12px 110px; }
      .brief-tradeoff { padding:12px 0 0; border-top:1px solid var(--seam); border-left:0; }
      .compass-shell { display:flex; min-height:780px; flex-direction:column; overflow:visible; }
      .root-rail { display:none; }
      .mobile-dock { position:sticky; z-index:25; bottom:0; order:2; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); padding:0; border-top:1px solid #779082; background:var(--cypress-deep); }
      .mobile-dock a { display:grid; place-items:center; min-height:58px; padding:5px 2px; border-right:1px solid rgba(255,255,255,.16); color:#d7e1da; font-size:10px; font-weight:650; text-align:center; text-decoration:none; }
      .mobile-dock a:last-child { border-right:0; }
      .mobile-dock a[aria-current="page"] { background:#285e46; color:white; }
      .workspace { order:1; }
      .workspace-topline { padding:8px 14px; }
      .branch-pill { display:none; }
      .thread-spine { padding:24px 16px 18px; }
      .thread-title { font-size:clamp(28px,9vw,42px); }
      .thread-sections { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .thread-sections button:nth-child(-n+2) { border-bottom:1px solid var(--seam); }
      .thread-sections button:nth-child(2) { border-right:0; }
      .thread-sections button:nth-child(3) { border-right:1px solid var(--seam); }
      .view-area { padding:22px 14px 30px; }
      .level-summary,.accordion-trigger { grid-template-columns:44px minmax(0,1fr); }
      .level-actions,.accordion-trigger .state { grid-column:2; justify-self:start; }
      .accordion-panel { padding:0 8px 12px; }
      .lesson-row { grid-template-columns:34px minmax(0,1fr); }
      .lesson-source { grid-column:2; }
      .project-row,.material-row { grid-template-columns:1fr; }
      .detail-facts { grid-template-columns:1fr; }
      .detail-facts div { border-right:0; border-bottom:1px solid var(--seam); }
      .detail-facts div:last-child { border-bottom:0; }
      .folio-entry { grid-template-columns:38px minmax(0,1fr); }
      .folio-entry .state { grid-column:2; justify-self:start; }
      .thread-map { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .map-node.final { grid-column:span 2; }
      .demo-status { right:12px; bottom:72px; }
    }
    @media (max-width:480px) {
      .lab-header { padding:15px 12px 10px; }
      .lab-copy h1 { font-size:26px; }
      .direction-tabs button { padding-inline:11px; }
      .workspace-topline { align-items:flex-start; }
      .breadcrumbs { white-space:normal; flex-wrap:wrap; }
      .spine-action { align-items:flex-start; flex-direction:column; }
      .vertical-focus > * { padding:18px 14px; }
      .journey { padding-left:29px; }
      .journey::before { left:11px; }
      .journey-level::before { left:-22px; }
      .dossier-index { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .dossier-index button { border-bottom:1px solid var(--seam); }
      .position-map { grid-template-columns:repeat(4,minmax(36px,1fr)); }
      .thread-map { grid-template-columns:1fr; }
      .map-node.final { grid-column:auto; }
    }
  </style>
</head>

  <script>
    const THREAD = {"thread":{"id":"thread_1786576304649_69e7c056","title":"Systems Thinking — From Orientation to Advanced Practice","type":"understand","status":"active","question":"How can I understand systems thinking deeply enough to model, intervene in, and improve real personal, business, organizational, and social systems?"},"levels":[{"n":0,"title":"Orientation","status":"in_progress","objective":"Establish the map of systems thinking without mistaking an introduction for the full theory.","project":{"title":"Level project — Level 0 — Orientation","status":"in_progress","description":"Explain what systems thinking is, and recognize bottlenecks, feedback loops, leverage points, and second-order effects from memory.","suggested_context":"Use Learning Compass as the recurring example when it helps make the method concrete."},"lessons":[{"title":"What systems thinking is","status":"in_progress","description":"Stage topic to understand and explain.","why_learn":"Traditional reductionism breaks systems into isolated components and fails when problems arise from interactions, non-linearities, and feedback. Systems thinking provides the foundational lens to see wholes, causal interconnections, and structural drivers rather than isolated events.","sources":6},{"title":"Bottlenecks","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Throughput in any multi-stage system is governed exclusively by its narrowest constraint (Goldratt's Theory of Constraints). Optimizing non-bottlenecks creates local excess inventory, exhausts resources, and generates zero systemic throughput gains.","sources":5},{"title":"Feedback loops","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Cause and effect in real systems do not operate in one-way open chains; outputs feed back as future inputs. Feedback loops explain runaway exponential momentum (reinforcing) and persistent equilibrium or resistance to change (balancing).","sources":5},{"title":"Leverage points","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"In complex systems, intuitive interventions usually produce low leverage or pushback, while high-leverage intervention points are counterintuitive and often fiercely resisted.","sources":5},{"title":"Second-order effects","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Most policy and organizational failures occur because decision-makers optimize for immediate, visible first-order payoffs while remaining blind to the delayed second- and third-order systemic repercussions that often reverse the original gains.","sources":5},{"title":"Modeling exercise","status":"not_started","description":"Draw a boundary map of one recurring personal or business problem, label elements/relationships/purpose, identify one bottleneck and one plausible feedback loop.","why_learn":"Systems thinking is a craft internalized through active diagramming and boundary selection, not passive conceptual reading.","sources":5},{"title":"One real-world application","status":"not_started","description":"Use the map to propose one small intervention and predict one second-order consequence before acting.","why_learn":"The ultimate test of systems thinking is whether it uncovers a misdiagnosed root cause or hidden constraint in your actual work or life.","sources":5}]},{"n":1,"title":"Foundations","status":"locked","objective":"Learn the basic objects, relationships, boundaries, and causal distinctions needed to analyze a system.","project":{"title":"Level project — Level 1 — Foundations","status":"not_started","description":"Explain systems thinking from memory and analyze a simple personal or business system.","suggested_context":"Use Learning Compass as the recurring example when it helps make the method concrete."},"lessons":[{"title":"What counts as a system","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Not every collection of parts is a system. Confusing a mere heap/collection (e.g., sand pile, list of tasks) with an integrated system (e.g., digestive tract, software pipeline) leads to flawed analytical methods.","sources":0},{"title":"Elements, relationships, and purpose","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Changing system elements has the least impact; changing relationships has moderate impact; changing the purpose/function completely alters system behavior.","sources":0},{"title":"System boundaries","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Boundaries are mental constructs, not physical truths. Drawing boundaries too narrowly creates blind spots and externalized costs; drawing them too broadly makes analysis intractable.","sources":0},{"title":"Structure versus events","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Event-level thinking leads to reactive firefighting and blaming individuals; structural thinking uncovers the underlying rules, delays, and loops that generate those events.","sources":0},{"title":"Stocks and flows","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Stocks (accumulations) are the state and memory of a system; flows (rates) are the activities that change stocks over time. Confusing stocks with flows is the #1 source of dynamic intuition failure (the Bathtub Fallacy).","sources":0},{"title":"Patterns over time","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Static snapshots hide trajectory, momentum, and inflection points. Graphing behavior over time reveals the signature archetypes of dynamic behavior.","sources":0},{"title":"Mental models","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"All decisions are based on mental models, which are simplified internal representations of how the world works. Flawed mental models produce systemic blind spots.","sources":0},{"title":"Linear versus systemic causality","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Linear causality assumes A causes B in isolation. Systemic causality recognizes that B also feeds back to influence A, often through delays and non-linear paths.","sources":0},{"title":"Modeling exercise","status":"not_started","description":"Analyze one simple system with a behavior-over-time sketch and a causal map; explicitly justify what is inside and outside the boundary.","why_learn":"Translates foundational concepts into a precise structural diagram combining boundaries, multiple stocks, flows, and closed feedback loops.","sources":0},{"title":"One real-world application","status":"not_started","description":"Apply the event/pattern/structure distinction to a recurring Learning Compass, business, or personal problem and identify a structural cause.","why_learn":"Validates structural analysis against live empirical observations, demonstrating how structural misdiagnoses caused previous interventions to fail.","sources":0}]},{"n":2,"title":"System Dynamics","status":"locked","objective":"Understand how feedback, delay, nonlinearity, and limits generate behavior over time.","project":{"title":"Level project — Level 2 — System Dynamics","status":"not_started","description":"Draw causal-loop diagrams and explain why a system behaves differently over time.","suggested_context":"Use Learning Compass as the recurring example when it helps make the method concrete."},"lessons":[{"title":"Positive and negative feedback","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Reinforcing (positive) feedback drives explosive growth or destructive collapse; balancing (negative) feedback resists change, seeks equilibrium, and stabilizes systems.","sources":0},{"title":"Reinforcing and balancing loops","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Real systems are networks where reinforcing loops generate momentum and balancing loops impose constraints, creating complex multi-loop interactions.","sources":0},{"title":"Delays","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Delays in material flow, perception, or decision-making cause systems to over-correct, overshoot targets, and oscillate violently.","sources":0},{"title":"Nonlinear relationships","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"In nonlinear systems, cause and effect are not proportional. A small change can cause a sudden catastrophic shift (tipping point), while a massive change may produce negligible results.","sources":0},{"title":"Exponential growth","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Exponential growth starts deceptively slowly and accelerates explosively, consistently fooling human linear intuition until resources are overwhelmed.","sources":0},{"title":"Limits to growth","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"No physical system can grow exponentially forever. When growth encounters carrying capacity, balancing loops inevitably take over, creating S-shaped growth or overshoot.","sources":0},{"title":"Oscillation","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Oscillation (boom-bust cycles, inventory bullwhip, price cycles) is the classic signature of negative feedback with significant delays in perception or action.","sources":0},{"title":"Overshoot and collapse","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"When an accelerating system exceeds its carrying capacity and permanently degrades the underlying resource base, growth turns into sudden, irreversible collapse.","sources":0},{"title":"Policy resistance","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Well-intentioned policies frequently fail or backfire because actors within the system adapt their behavior to preserve their own local goals, defeating the central policy.","sources":0},{"title":"Modeling exercise","status":"not_started","description":"Create a causal-loop plus stock-flow model of a system with at least one delay and one limit; mentally simulate behavior over time and state assumptions.","why_learn":"Builds a complete dynamic hypothesis explaining a growing, oscillating, or plateauing behavior mode over time.","sources":0},{"title":"One real-world application","status":"not_started","description":"Use the model to compare two policies and predict timing, unintended effects, and conditions under which each fails.","why_learn":"Tests your ability to diagnose a live, complex dynamic pathology (e.g., inventory bullwhip, hiring boom-bust, product adoption plateau) in the wild.","sources":0}]},{"n":3,"title":"Modeling","status":"locked","objective":"Construct, inspect, and improve explanatory models rather than only describing systems verbally.","project":{"title":"Level project — Level 3 — Modeling","status":"not_started","description":"Build and explain three models: a personal system, a business system, and a social or organizational system.","suggested_context":"Use Learning Compass as the recurring example when it helps make the method concrete."},"lessons":[{"title":"Behavior-over-time graphs","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"BOTGs serve as the empirical reference mode for formal modeling, anchoring model development to observed historical data patterns.","sources":0},{"title":"Causal-loop diagrams","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"CLDs provide an intuitive qualitative map of feedback structures, capturing hypotheses about loop dominance and causal interactions.","sources":0},{"title":"Stock-and-flow diagrams","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"CLDs cannot be simulated directly because they blur the distinction between accumulations and rates. Stock-and-flow diagrams provide the mathematical rigor needed for computational simulation.","sources":0},{"title":"Basic simulation","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Human mental simulation fails completely on multi-loop nonlinear systems with delays. Numerical computational simulation reveals actual system behavior over time.","sources":0},{"title":"Model assumptions","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Every model is wrong, but some are useful. Being explicit about structural assumptions, exogenous inputs, and simplifications determines model credibility.","sources":0},{"title":"Calibration and validation","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Fitting parameters to historical data (curve fitting) does not prove structural validity. System Dynamics models require rigorous tests of structural and behavioral validity.","sources":0},{"title":"Boundary criticism","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Model boundaries reflect values and power dynamics. Werner Ulrich's Critical Systems Heuristics (CSH) interrogates who benefits, who is harmed, and what is excluded.","sources":0},{"title":"Sensitivity analysis","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Real-world parameters are always uncertain. Sensitivity analysis reveals whether policy recommendations hold across parameter ranges or collapse under slight variations.","sources":0},{"title":"Modeling exercise","status":"not_started","description":"Build and document three small models—personal, business, and organizational/social—with equations or explicit rules, assumptions, reference behavior, and at least one sensitivity test.","why_learn":"Solidifies formal modeling by building, simulating, and stress-testing a complete stock-and-flow model from scratch.","sources":0},{"title":"One real-world application","status":"not_started","description":"Use one model to support a real decision; compare its prediction with a plausible alternative model and explain what evidence would discriminate between them.","why_learn":"Validates simulation modeling against real historical datasets and decision dilemmas in a professional or operational context.","sources":0}]},{"n":4,"title":"Leverage and Intervention","status":"locked","objective":"Diagnose intervention opportunities and anticipate why intuitive solutions can fail.","project":{"title":"Level project — Level 4 — Leverage and Intervention","status":"not_started","description":"For a real problem, identify the symptom, underlying structure, feedback loops, highest-leverage intervention, and likely side effects.","suggested_context":"Use Learning Compass as the recurring example when it helps make the method concrete."},"lessons":[{"title":"Where intervention actually works","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Most interventions target parameters (subsidies, tax rates, headcounts), which represent the lowest leverage points in a system and produce minimal enduring change.","sources":0},{"title":"Why obvious solutions often fail","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Obvious, intuitive solutions usually address surface symptoms, triggering compensating balancing loops that restore the problem or shift the burden to another part of the system.","sources":0},{"title":"Delayed consequences","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Interventions that produce immediate benefits often carry long-delayed structural penalties, creating a dynamic trap known as 'Better-Before-Worse'.","sources":0},{"title":"Unintended side effects","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"There is no such thing as an isolated side effect—there are only systemic effects that cross arbitrary departmental or temporal boundaries.","sources":0},{"title":"Incentive redesign","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"People respond to the incentives created by the system's structural rules, not to managerial exhortations. Perverse incentives (Kerr's Folly, Cobra Effect) guarantee counterproductive behavior.","sources":0},{"title":"Rules and information flows","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Adding new information links (e.g., real-time feedback, public transparency) and changing operational rules is high leverage and remarkably inexpensive compared to physical capital investment.","sources":0},{"title":"Changing goals and paradigms","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"The purpose/goal of a system dictates all lower-level rules, feedback loops, and stocks. Shifting the overarching goal or transcending the dominant paradigm produces massive transformation.","sources":0},{"title":"Policy resistance","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Even high-leverage interventions trigger political, psychological, and organizational immune responses if stakeholders feel threatened by the reallocation of power or resources.","sources":0},{"title":"Modeling exercise","status":"not_started","description":"For one real problem, map symptom, structure, loops, information flows, incentives, goals, candidate intervention points, and likely side effects in an intervention matrix.","why_learn":"Integrates symptoms, structure, incentives, rules, goals, and candidate leverage points into a comprehensive intervention matrix.","sources":0},{"title":"One real-world application","status":"not_started","description":"Choose one intervention, define a measurable leading indicator and a guardrail, run or design a bounded test, and record resistance or adaptation.","why_learn":"Proves your ability to design and execute a bounded, low-risk pilot intervention on a real system with clear leading indicators.","sources":0},{"title":"Modeling exercise","status":"not_started","description":"For one real problem, map symptom, structure, loops, information flows, incentives, goals, candidate intervention points, and likely side effects in an intervention matrix.","why_learn":"Advanced intervention modeling comparing competing policy packages across different stakeholder coalitions and time horizons.","sources":0},{"title":"One real-world application","status":"not_started","description":"Choose one intervention, define a measurable leading indicator and a guardrail, run or design a bounded test, and record resistance or adaptation.","why_learn":"Demonstrates long-term tracking of systemic change, observing how adaptive resistance emerges over time and adjusting rules accordingly.","sources":0}]},{"n":5,"title":"Applied Systems Thinking","status":"locked","objective":"Transfer systems thinking into domains and decisions that matter in daily and professional life.","project":{"title":"Level project — Level 5 — Applied Systems Thinking","status":"not_started","description":"Use systems thinking to improve one real decision or project.","suggested_context":"Use Learning Compass as the recurring example when it helps make the method concrete."},"lessons":[{"title":"Business and cash flow","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Financial bankruptcy is an operational stock-flow collapse where cash outflows exceed inflows despite accounting profitability. Business systems thinking links operational delays directly to working capital dynamics.","sources":0},{"title":"Learning Compass","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Knowledge acquisition, retention, and application form an interconnected cognitive system governed by decay stocks, retrieval flows, and focus allocation constraints.","sources":0},{"title":"Personal productivity","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Personal productivity is constrained by energy stocks, cognitive switching costs, and backlog accumulation. Treating productivity as linear task execution causes burnout.","sources":0},{"title":"Organizations and power","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Formal org charts describe hierarchy, but informal political networks, information asymmetries, and resource control dictate actual organizational behavior.","sources":0},{"title":"Relationships and small groups","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Interpersonal conflicts and family dynamics are reciprocal feedback loops, not one-sided moral failings (Bowen Family Systems Theory).","sources":0},{"title":"Markets","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Financial and product markets are complex adaptive systems characterized by reflexivity (Soros), endogenous bubbles, and network effects, not static equilibrium.","sources":0},{"title":"Technology systems","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Software architectures and technology platforms are sociotechnical systems where technical debt accumulates as a hidden stock, slowing feature velocity and compounding fragility.","sources":0},{"title":"Public policy","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Public policy operates in high-complexity, multi-actor environments where regulatory interventions produce sprawling unintended social and economic consequences.","sources":0},{"title":"Modeling exercise","status":"not_started","description":"Produce one integrated case model in a domain that matters to you, including stakeholders, flows, feedback, delays, incentives, decision points, and an implementation plan.","why_learn":"Deepens domain mastery by constructing an integrated multi-sector case model in your specific field of expertise.","sources":0},{"title":"One real-world application","status":"not_started","description":"Improve one real decision or project using the model; record baseline, intervention, outcome, unintended effects, and next iteration.","why_learn":"Directly improves an active real-world operational decision using the domain model, recording empirical baseline, intervention, and results.","sources":0}]},{"n":6,"title":"Advanced Direction","status":"locked","objective":"Choose advanced directions only after the foundational model-building and application evidence is strong.","project":{"title":"Level project — Level 6 — Advanced Direction","status":"not_started","description":"Select a justified advanced direction and explain how it extends the foundation.","suggested_context":"Use Learning Compass as the recurring example when it helps make the method concrete."},"lessons":[{"title":"Formal system dynamics","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Advanced professional practice requires rigorous continuous differential equation formulation, eigenvalue stability analysis, and formal sensitivity testing.","sources":0},{"title":"Complex adaptive systems","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"CAS consists of diverse, decentralized agents that learn, adapt, and co-evolve, creating macroscopic emergent phenomena that cannot be modeled by aggregate differential equations alone.","sources":0},{"title":"Viable systems","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Stafford Beer's Viable System Model (VSM) provides an invariant cybernetic architecture for autonomous, self-organizing systems that survive in volatile environments.","sources":0},{"title":"Cybernetics","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"First-order cybernetics studies observed systems (control and feedback); second-order cybernetics studies observing systems (the role of the observer, self-reference, and epistemological reflexivity).","sources":0},{"title":"Network science","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"System structure is topological. Network science reveals how degree distributions (scale-free networks, power laws), clustering, and centrality determine systemic vulnerability to targeted attacks vs random failures.","sources":0},{"title":"Agent-based modeling","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"ABM simulates individual autonomous agents following local behavioral rules, allowing macro-level social structures (segregation, market crashes, flocking) to emerge computationally from the bottom up.","sources":0},{"title":"Resilience and systemic risk","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Optimizing for maximum efficiency strips out systemic buffers and redundancies, making tightly coupled systems hyper-fragile to catastrophic systemic contagion (Haldane & May).","sources":0},{"title":"Organizational learning","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Single-loop learning corrects errors within existing rules; double-loop learning questions and rewrites the underlying governing variables and assumptions. Most organizations are trapped in defensive single-loop routines.","sources":0},{"title":"Systems intervention ethics","status":"not_started","description":"Stage topic to understand and explain.","why_learn":"Intervening in complex human systems involves power, coercion, value conflicts, and unintended harms. Technocratic optimization without ethical boundaries is dangerous and illegitimate.","sources":0},{"title":"Modeling exercise","status":"not_started","description":"Choose one advanced direction, justify the choice, and build a comparative model or annotated research brief showing what the approach adds, assumes, and cannot explain.","why_learn":"Evaluates and compares different modeling paradigms (System Dynamics vs Agent-Based Modeling vs Network Analysis) on a single complex challenge to identify their respective strengths and blind spots.","sources":0},{"title":"One real-world application","status":"not_started","description":"Use the advanced lens on a real system to generate one testable insight or design implication, while stating uncertainty and ethical risks.","why_learn":"Deploys advanced multi-paradigm systems practice to generate a testable, high-leverage strategic insight on an active complex problem while explicitly stating uncertainties and ethical risks.","sources":0}]}],"materials":{"notes":["System Dynamics for a Complex World","The Paths to Power","Negotiation and Nonviolent Action"],"cards":["يعني إيه BATNA؟"],"drafts":["ليه بناء النموذج عملية تكرارية؟","مبدأ «البنية تولّد السلوك» بيرفض إيه؟","إيه اللي بيضيفه إغلاق الحلقة في التفكير النظمي؟","إزاي يكمل الفعل والتفاوض بعضهما؟","إيه التعريف العملي للقوة؟","ليه الجوهر والظهور مطلوبان معًا في بناء السمعة؟","إزاي القوة بتتراكم وتضاعف نفسها؟"],"files":0}};

        return;
      }
      var materialButton = event.target.closest('[data-material-index]');
      if (materialButton) {
        state.materialIndex = Number(materialButton.getAttribute('data-material-index'));
        renderPrototype();
        return;
      }
      var demoAction = event.target.closest('[data-demo-action]');
      if (demoAction) {
        event.preventDefault();
        showStatus(demoAction.getAttribute('data-demo-action'));
      }
    });
    document.addEventListener('change',function(event){
      if (event.target.matches('[data-material-search]')) {
        state.query = event.target.value;
        state.materialIndex = 0;
        renderPrototype();
      }
      if (event.target.matches('[data-lesson-search]')) {
        state.lessonQuery = event.target.value;
        renderPrototype();
      }
    });
    document.querySelector('.direction-tabs').addEventListener('keydown',function(event){
      if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft' && event.key !== 'Home' && event.key !== 'End') return;
      event.preventDefault();
      if (event.key === 'Home') state.variant = 1;
      else if (event.key === 'End') state.variant = 10;
      else state.variant = ((state.variant - 1 + (event.key === 'ArrowRight' ? 1 : -1) + 10) % 10) + 1;
      renderPrototype();
      document.querySelector('[data-choose-variant="' + state.variant + '"]').focus();
    });
    function loadInitialState() {
      var params = new URLSearchParams(location.hash.replace(/^#/,''));
      var variant = Number(params.get('v'));
      var level = Number(params.get('level'));
      var lesson = Number(params.get('lesson'));
      var section = params.get('section');
      if (variant >= 1 && variant <= 10) state.variant = variant;
      if (SECTIONS.indexOf(section) !== -1) state.section = section;
      if (level >= 0 && level < THREAD.levels.length) state.level = level;
      if (lesson >= 0 && lesson < THREAD.levels[state.level].lessons.length) state.lesson = lesson;
    }
    loadInitialState();
    renderPrototype();

  </script>
</body>
</html>
