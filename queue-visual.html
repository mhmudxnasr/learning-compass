<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queue — Taste Map</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0b0e14;
  color: #f1f5f9;
  font-family: 'Inter', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 16px;
}
.container {
  max-width: 680px;
  width: 100%;
}
.header {
  margin-bottom: 28px;
}
.header h1 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: #f1f5f9;
  display: flex;
  align-items: center;
  gap: 10px;
}
.header h1 span { color: #2dd4bf; }
.header .sub {
  font-size: 13px;
  color: #64748b;
  margin-top: 4px;
  display: flex;
  gap: 16px;
  align-items: center;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(45,212,191,0.12);
  color: #5eead4;
  font-size: 12px;
  font-weight: 600;
  padding: 2px 10px;
  border-radius: 100px;
}
.badge-amber {
  background: rgba(251,191,36,0.12);
  color: #fbbf24;
}
.badge-muted {
  background: rgba(71,85,105,0.3);
  color: #94a3b8;
}
.card {
  background: #0f172a;
  border: 1px solid #1e293b;
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 14px;
  transition: border-color 0.15s;
}
.card:hover { border-color: #334155; }
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 10px;
}
.title {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.5;
  color: #e2e8f0;
  flex: 1;
}
.title a {
  color: inherit;
  text-decoration: none;
}
.title a:hover { color: #5eead4; }
.type-tag {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  padding: 3px 10px;
  border-radius: 100px;
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 2px;
}
.type-tag.video { background: rgba(99,102,241,0.15); color: #818cf8; }
.type-tag.podcast { background: rgba(244,114,182,0.15); color: #f472b6; }
.type-tag.article { background: rgba(251,191,36,0.12); color: #fbbf24; }
.creator {
  font-size: 13px;
  color: #94a3b8;
  margin-bottom: 10px;
}
.creator a { color: #94a3b8; text-decoration: none; }
.creator a:hover { color: #e2e8f0; }
.why {
  font-size: 13px;
  line-height: 1.7;
  color: #94a3b8;
  background: rgba(15,23,42,0.5);
  border-radius: 6px;
  padding: 12px;
  border-left: 3px solid #2dd4bf;
  margin-bottom: 12px;
}
.why strong { color: #cbd5e1; font-weight: 600; }
.card-footer {
  display: flex;
  gap: 12px;
  align-items: center;
  font-size: 11px;
  color: #64748b;
  flex-wrap: wrap;
}
.card-footer .dot { width: 4px; height: 4px; border-radius: 50%; background: #475569; }
.rating-dots {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid #1e293b;
}
.rating-dot {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1.5px solid #334155;
  background: transparent;
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.rating-dot:hover { border-color: #64748b; background: rgba(255,255,255,0.05); }
.rating-dot.active { border-color: #2dd4bf; background: rgba(45,212,191,0.12); }

.empty-state {
  text-align: center;
  padding: 60px 20px;
}
.empty-state svg { width: 48px; height: 48px; color: #334155; margin-bottom: 16px; }
.empty-state h2 { font-size: 18px; font-weight: 600; color: #64748b; margin-bottom: 8px; }
.empty-state p { font-size: 13px; color: #475569; }

.age-bar {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-top: 12px;
}
.age-bar .seg {
  height: 4px;
  border-radius: 2px;
  flex: 1;
  background: #1e293b;
}
.age-bar .seg.filled.0d { background: #22c55e; }
.age-bar .seg.filled.7d { background: #eab308; }
.age-bar .seg.filled.14d { background: #f97316; }
.age-bar .seg.filled.21d { background: #ef4444; }
.age-label { font-size: 10px; color: #64748b; white-space: nowrap; }
</style>
</head>
<body>
<div class="container" id="app"></div>
<script>
const data = {"recommendations":[{"id":"rec_1785249374719_trym0","video_title":"The Man Who Studied 1,000 Deaths to Learn How to Live — BJ Miller on Tim Ferriss (#153)","creator":"BJ Miller (with Tim Ferriss)","content_type":"podcast","video_url":"https://www.youtube.com/watch?v=1eLfGgOjHRU","why_this":"Your life-mort node is locked (LOVE). You consumed Solomon on TMT (theoretical framework of death anxiety, rated 9/10). BJ Miller is the clinical complement: palliative care physician who sat with 1000+ dying patients. Where Solomon gives you the theory of why we fear death, Miller gives you what death actually teaches about living — from the bedside. Dense, human, zero abstraction. 2hr long-form (you loved the Lex format).","verified":"2026-07-28","status":"active","user_rating":"unset","created_at":"2026-07-28 14:36:14"},{"id":"rec_1785228044742_lmtgm","video_title":"How to Enhance Focus and Improve Productivity | Dr. Cal Newport (Huberman Lab #167)","creator":"Cal Newport (hosted by Andrew Huberman)","content_type":"video","video_url":"https://www.youtube.com/watch?v=p4ZfkezDTXQ","why_this":"FRESH attention-focus node, zero consumed. Newport deep-work framework + Huberman network-switching cost & neuro-semantic coherence — direct applied value for your AI-workflow + deep-work cluster. Primary-source talk, no guru fluff.","verified":"2026-07-28","status":"active","user_rating":"unset","created_at":"2026-07-28 08:40:44"}]};

function dayDiff(d) {
  if (!d) return 999;
  return Math.floor((Date.now() - new Date(d).getTime()) / 86400000);
}

function render() {
  const items = data.recommendations;
  const app = document.getElementById('app');
  const now = Date.now();

  let html = '';
  html += '<div class="header">';
  html += '<h1><span>◉</span> Queue <span class="badge">' + items.length + ' waiting</span></h1>';
  html += '<div class="sub">';
  const monthItems = items.filter(r => r.created_at && r.created_at.startsWith('2026-07')).length;
  html += '<span>' + monthItems + ' this month</span>';
  const stale = items.filter(r => r.verified && dayDiff(r.verified) > 7).length;
  if (stale > 0) html += '<span class="badge badge-amber">' + stale + ' stale (7d+)</span>';
  html += '</div></div>';

  if (!items.length) {
    html += '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg><h2>Queue is clear</h2><p>Nothing waiting for review. Push something new.</p></div>';
    app.innerHTML = html;
    return;
  }

  // Today's Pick
  const pick = items[0];
  html += '<div class="card" style="border-color:#2dd4bf;background:linear-gradient(135deg,#0f172a 0%,#0b1a1f 100%)">';
  html += '<div style="font-size:10px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#5eead4;margin-bottom:8px">★ Today\'s Pick</div>';
  html += '<div class="card-header"><div class="title"><a href="' + pick.video_url + '" target="_blank">' + pick.video_title + '</a></div><span class="type-tag ' + pick.content_type + '">' + pick.content_type + '</span></div>';
  html += '<div class="creator">' + pick.creator + '</div>';
  html += '<div class="why">' + pick.why_this + '</div>';
  const pickAge = dayDiff(pick.verified);
  html += '<div class="card-footer"><span>' + pickAge + 'd old</span><span class="dot"></span><span>added ' + pick.created_at + '</span></div>';
  html += '</div>';

  // Rest of queue
  for (let i = 1; i < items.length; i++) {
    const r = items[i];
    const age = dayDiff(r.verified);
    const dayAgo = dayDiff(r.created_at);
    html += '<div class="card">';
    html += '<div class="card-header"><div class="title"><a href="' + r.video_url + '" target="_blank">' + r.video_title + '</a></div><span class="type-tag ' + r.content_type + '">' + r.content_type + '</span></div>';
    html += '<div class="creator">' + r.creator + '</div>';
    html += '<div class="why">' + r.why_this + '</div>';
    // Age bar
    const segs = [
      { days: 0, filled: true, cls: '0d' },
      { days: 7, filled: age >= 7, cls: '7d' },
      { days: 14, filled: age >= 14, cls: '14d' },
      { days: 21, filled: age >= 21, cls: '21d' },
    ];
    html += '<div class="age-bar">';
    segs.forEach((s, idx) => {
      html += '<div class="seg' + (s.filled ? ' filled ' + s.cls : '') + '"></div>';
    });
    html += '<span class="age-label">' + age + 'd in queue</span>';
    html += '</div>';
    html += '<div class="card-footer"><span>' + age + 'd old</span><span class="dot"></span><span>added ' + r.created_at + '</span></div>';
    html += '</div>';
  }

  // Rating hint
  html += '<div style="margin-top:20px;padding:12px 16px;background:#0f172a;border:1px solid #1e293b;border-radius:8px;font-size:12px;color:#64748b;text-align:center">⬅ review sheet → <span style="color:#2dd4bf">POST /recommendations/action</span> · consume · reject · rate</div>';

  app.innerHTML = html;
}
render();
</script>
</body>
</html>
