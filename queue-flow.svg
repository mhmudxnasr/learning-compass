<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#12161e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 -5 10 10" refX="22" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0-5L10 0L0 5" fill="#2dd4bf"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 -5 10 10" refX="22" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0-5L10 0L0 5" fill="#475569"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 -5 10 10" refX="22" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0-5L10 0L0 5" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="1000" height="750" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="700" letter-spacing="-0.3">Queue File Path</text>
  <text x="500" y="56" text-anchor="middle" fill="#64748b" font-size="11" font-weight="500">recommendations-worker · taste map engine</text>

  <!-- ===== UPPER SECTION LABELS ===== -->
  <text x="120" y="90" text-anchor="middle" fill="#64748b" font-size="10" font-weight="600" letter-spacing="0.8" text-transform="uppercase">ENTRY</text>
  <text x="380" y="90" text-anchor="middle" fill="#64748b" font-size="10" font-weight="600" letter-spacing="0.8">DATABASE / API</text>
  <text x="620" y="90" text-anchor="middle" fill="#64748b" font-size="10" font-weight="600" letter-spacing="0.8">QUEUE FRONTEND</text>
  <text x="860" y="90" text-anchor="middle" fill="#64748b" font-size="10" font-weight="600" letter-spacing="0.8">USER ACTION</text>

  <!-- ===== ENTRY NODES (Left column) ===== -->
  <!-- Telegram Bot -->
  <rect x="40" y="105" rx="8" width="160" height="52" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="120" y="126" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600" letter-spacing="0.5">TELEGRAM BOT</text>
  <text x="120" y="142" text-anchor="middle" fill="#e2e8f0" font-size="11">/queue command / link send</text>

  <!-- API Push -->
  <rect x="40" y="175" rx="8" width="160" height="52" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="120" y="196" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600" letter-spacing="0.5">API PUSH</text>
  <text x="120" y="212" text-anchor="middle" fill="#e2e8f0" font-size="11">POST /recommendations/push</text>

  <!-- Cron -->
  <rect x="40" y="245" rx="8" width="160" height="52" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="120" y="266" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600" letter-spacing="0.5">CRON (every 6h)</text>
  <text x="120" y="282" text-anchor="middle" fill="#e2e8f0" font-size="11">Schema migration + cleanup</text>

  <!-- Arrow from all three → DB -->
  <line x1="200" y1="131" x2="280" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-dim)"/>
  <line x1="200" y1="201" x2="280" y2="200" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="271" x2="280" y2="210" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-dim)"/>

  <!-- ===== DATABASE NODES (Center-left) ===== -->
  <!-- recommendations table -->
  <rect x="280" y="145" rx="8" width="180" height="150" fill="#0d1b2a" stroke="#2dd4bf" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="280" y="145" rx="8" width="180" height="28" fill="#0d9488" opacity="0.2"/>
  <text x="370" y="163" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="700" letter-spacing="0.6">RECOMMENDATIONS</text>
  <text x="290" y="190" fill="#94a3b8" font-size="9.5">status: <tspan fill="#fbbf24" font-weight="600">'active'</tspan></text>
  <text x="290" y="206" fill="#94a3b8" font-size="9.5">status: <tspan fill="#34d399" font-weight="600">'consumed'</tspan></text>
  <text x="290" y="222" fill="#94a3b8" font-size="9.5">status: <tspan fill="#f87171" font-weight="600">'rejected'</tspan></text>
  <text x="290" y="242" fill="#64748b" font-size="9">+ 14 columns (rating, review,</text>
  <text x="290" y="256" fill="#64748b" font-size="9">creator, dedup_key, synergy…)</text>
  <text x="290" y="276" fill="#475569" font-size="8.5">↳ D1: recommendations-db</text>

  <!-- undo_queue -->
  <rect x="280" y="310" rx="6" width="180" height="44" fill="#1e293b" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="370" y="329" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">UNDO QUEUE</text>
  <text x="370" y="344" text-anchor="middle" fill="#64748b" font-size="8.5">30-second expiry → auto-purge</text>

  <!-- resurfacing -->
  <rect x="280" y="368" rx="6" width="180" height="68" fill="#1e293b" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="370" y="387" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="600">RESURFACING</text>
  <text x="290" y="404" fill="#94a3b8" font-size="9">3 stages: <tspan fill="#c084fc">30d</tspan> · <tspan fill="#c084fc">90d</tspan> · <tspan fill="#c084fc">180d</tspan></text>
  <text x="290" y="420" fill="#94a3b8" font-size="9">due_at → curate resurfacing view</text>

  <!-- contradictions -->
  <rect x="280" y="450" rx="6" width="180" height="44" fill="#1e293b" stroke="#f87171" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="370" y="469" text-anchor="middle" fill="#f87171" font-size="9" font-weight="600">CONTRADICTIONS</text>
  <text x="370" y="484" text-anchor="middle" fill="#64748b" font-size="8.5">opposite ratings in same branch</text>

  <!-- Arrow DB → Frontend -->
  <line x1="460" y1="220" x2="530" y2="220" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="495" y="210" text-anchor="middle" fill="#475569" font-size="8">GET</text>

  <!-- ===== FRONTEND VIEWS (Center-right) ===== -->
  <rect x="530" y="100" rx="8" width="180" height="148" fill="#0d1b2a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <rect x="530" y="100" rx="8" width="180" height="26" fill="#14b8a6" opacity="0.12"/>
  <text x="620" y="117" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="700">QUEUE VIEW</text>
  <text x="540" y="142" fill="#e2e8f0" font-size="9.5">Today's Pick</text>
  <text x="540" y="158" fill="#64748b" font-size="9">Dashboard (4 stats)</text>
  <text x="540" y="174" fill="#64748b" font-size="9">Queue cards</text>
  <text x="540" y="190" fill="#64748b" font-size="9">Age grouping</text>
  <text x="540" y="210" fill="#475569" font-size="8.5">↳ filters: type, creator, search</text>
  <text x="540" y="226" fill="#475569" font-size="8.5">↳ inline rating / one-tap reject</text>

  <rect x="530" y="262" rx="8" width="180" height="92" fill="#0d1b2a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <rect x="530" y="262" rx="8" width="180" height="26" fill="#34d399" opacity="0.12"/>
  <text x="620" y="279" text-anchor="middle" fill="#34d399" font-size="10" font-weight="700">ARCHIVE VIEW</text>
  <text x="540" y="302" fill="#94a3b8" font-size="9">Timeline of consumed items</text>
  <text x="540" y="318" fill="#94a3b8" font-size="9">Filter by branch / rating</text>
  <text x="540" y="334" fill="#94a3b8" font-size="9">Group by month</text>

  <rect x="530" y="368" rx="8" width="180" height="68" fill="#0d1b2a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <rect x="530" y="368" rx="8" width="180" height="26" fill="#c084fc" opacity="0.12"/>
  <text x="620" y="385" text-anchor="middle" fill="#c084fc" font-size="10" font-weight="700">RESURFACING VIEW</text>
  <text x="540" y="408" fill="#94a3b8" font-size="9">Overdue / Due soon / Future</text>
  <text x="540" y="424" fill="#94a3b8" font-size="9">Spaced repetition prompts</text>

  <!-- Arrow Frontend → User Action -->
  <line x1="710" y1="185" x2="775" y2="185" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="742" y="177" text-anchor="middle" fill="#475569" font-size="8">click</text>

  <line x1="710" y1="300" x2="775" y2="300" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="742" y="292" text-anchor="middle" fill="#475569" font-size="8">click</text>

  <!-- ===== USER ACTION NODES (Right) ===== -->
  <rect x="775" y="105" rx="8" width="185" height="340" fill="#0d1b2a" stroke="#1e293b" stroke-width="1"/>
  <rect x="775" y="105" rx="8" width="185" height="28" fill="#f59e0b" opacity="0.08"/>
  <text x="867" y="123" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="700" letter-spacing="0.5">REVIEW SHEET</text>

  <!-- Rating block -->
  <rect x="787" y="145" rx="6" width="161" height="60" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="867" y="162" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">RATING</text>
  <text x="867" y="180" text-anchor="middle" fill="#e2e8f0" font-size="11">❤️ love · 👍 like</text>
  <text x="867" y="196" text-anchor="middle" fill="#e2e8f0" font-size="11">😐 meh · 👎 dislike</text>

  <!-- Status actions -->
  <rect x="787" y="218" rx="6" width="161" height="72" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="867" y="237" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">ACTION</text>
  <text x="795" y="256" fill="#c084fc" font-size="9.5">     POST /recommendations/action</text>
  <text x="800" y="273" fill="#34d399" font-size="9.5">consumed  ←  review required</text>
  <text x="800" y="289" fill="#f87171" font-size="9.5">rejected  ←  no review needed</text>

  <!-- Delete -->
  <rect x="787" y="304" rx="6" width="161" height="44" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="867" y="323" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">DELETE</text>
  <text x="867" y="341" text-anchor="middle" fill="#fbbf24" font-size="9.5">POST /recommendations/delete</text>

  <!-- ===== DOWNWARD FLOWS ===== -->

  <!-- Action → DB recycle -->
  <path d="M 867 295 L 867 310 L 460 310 L 460 220" fill="none" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="318" fill="#475569" font-size="8">UPDATE status</text>
  <text x="660" y="330" fill="#475569" font-size="8">+ SET user_rating</text>

  <!-- consumed → resurfacing -->
  <path d="M 460 395 L 530 395" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="495" y="388" text-anchor="middle" fill="#a78bfa" font-size="8">on consume</text>

  <!-- consumed → contradictions -->
  <path d="M 460 470 L 530 470" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="495" y="463" text-anchor="middle" fill="#f87171" font-size="8">on consume</text>

  <!-- delete → undo_queue -->
  <path d="M 867 335 L 867 350 L 460 350 L 460 330" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arrow-warn)"/>
  <text x="665" y="348" fill="#64748b" font-size="8">undo? → snapshots</text>

  <!-- ===== BOTTOM LEGEND ===== -->
  <text x="500" y="540" text-anchor="middle" fill="#475569" font-size="8.5" letter-spacing="0.5">LEGEND</text>
  <line x1="350" y1="557" x2="385" y2="557" stroke="#2dd4bf" stroke-width="2"/>
  <text x="390" y="561" fill="#64748b" font-size="9">primary flow</text>
  <line x1="460" y1="557" x2="495" y2="557" stroke="#475569" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="500" y="561" fill="#64748b" font-size="9">side effect</text>
  <line x1="570" y1="557" x2="605" y2="557" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="610" y="561" fill="#64748b" font-size="9">undo path</text>

  <!-- ===== BOTTOM: FULL LIFECYCLE PIPELINE ===== -->
  <text x="500" y="590" text-anchor="middle" fill="#475569" font-size="8.5" letter-spacing="0.5">LIFECYCLE SUMMARY</text>

  <rect x="20" y="608" rx="6" width="960" height="120" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>

  <!-- Pipeline stages -->
  <rect x="40" y="624" rx="6" width="120" height="42" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
  <text x="100" y="643" text-anchor="middle" fill="#fbbf24" font-size="8" font-weight="600">STAGE 1</text>
  <text x="100" y="658" text-anchor="middle" fill="#e2e8f0" font-size="9">Pushed / Ingested</text>

  <line x1="160" y1="645" x2="190" y2="645" stroke="#475569" stroke-width="1" marker-end="url(#arrow-dim)"/>

  <rect x="190" y="624" rx="6" width="100" height="42" fill="#1e293b" stroke="#2dd4bf" stroke-width="1"/>
  <text x="240" y="643" text-anchor="middle" fill="#2dd4bf" font-size="8" font-weight="600">STAGE 2</text>
  <text x="240" y="658" text-anchor="middle" fill="#e2e8f0" font-size="9">Waiting (active)</text>

  <line x1="290" y1="645" x2="320" y2="645" stroke="#475569" stroke-width="1" marker-end="url(#arrow-dim)"/>

  <rect x="320" y="624" rx="6" width="120" height="42" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
  <text x="380" y="643" text-anchor="middle" fill="#34d399" font-size="8" font-weight="600">STAGE 3</text>
  <text x="380" y="658" text-anchor="middle" fill="#e2e8f0" font-size="9">Consumed + Review</text>

  <line x1="440" y1="645" x2="470" y2="645" stroke="#475569" stroke-width="1" marker-end="url(#arrow-dim)"/>

  <rect x="470" y="624" rx="6" width="120" height="42" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
  <text x="530" y="643" text-anchor="middle" fill="#a78bfa" font-size="8" font-weight="600">STAGE 4</text>
  <text x="530" y="658" text-anchor="middle" fill="#e2e8f0" font-size="9">Resurfacing</text>

  <line x1="590" y1="645" x2="620" y2="645" stroke="#475569" stroke-width="1" marker-end="url(#arrow-dim)"/>

  <rect x="620" y="624" rx="6" width="120" height="42" fill="#1e293b" stroke="#f87171" stroke-width="1"/>
  <text x="680" y="643" text-anchor="middle" fill="#f87171" font-size="8" font-weight="600">STAGE 5</text>
  <text x="680" y="658" text-anchor="middle" fill="#e2e8f0" font-size="9">Rejected / Deleted</text>

  <!-- Divergent path: Rejected shortcut from Stage 2 -->
  <path d="M 290 666 L 290 680 L 680 680 L 680 666" fill="none" stroke="#f87171" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow-dim)"/>
  <text x="485" y="676" text-anchor="middle" fill="#f87171" font-size="7.5">one-tap reject</text>

  <!-- Key stats -->
  <text x="40" y="702" fill="#64748b" font-size="9">Files: src/api/recommendations.ts · src/assets/js.ts (views curate.*) · src/index.ts (Telegram /queue + cron) · schema_v2.sql (resurfacing, undo_queue) · wrangler.toml (cron schedule)</text>
  <text x="40" y="716" fill="#475569" font-size="8.5">Total queue endpoints: 7 (active, list, push, action, delete, undo, export) · Sub-views: queue, archive, all, resurfacing, tensions, bundles</text>
</svg>
