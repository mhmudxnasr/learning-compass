name = "recommendations-worker"
main = "src/index.ts"
compatibility_date = "2026-07-27"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "recommendations-db"
database_id = "49c68912-ce6e-4899-8e73-8955a6a21dee"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "taste-map-artifacts"

[[vectorize]]
binding = "COMPASS_VECTORS"
index_name = "learning-compass-semantic"

[ai]
binding = "AI"

[triggers]
crons = ["0 */6 * * *"]
