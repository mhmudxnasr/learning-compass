name: Verify

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      full:
        description: Run portable unit tests and browser E2E in addition to fast checks
        type: boolean
        default: false

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:fast
      - if: inputs.full == true
        run: npm run test:unit:portable
      - if: inputs.full == true
        run: npx playwright install --with-deps chromium
      - if: inputs.full == true
        run: npm run test:e2e
